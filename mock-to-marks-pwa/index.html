<title>Mock-to-Marks — ProDJEE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mock-to-Marks">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ProDJEE brand system: near-black surface, gold/red/green accents, Manrope + JetBrains Mono.
   Committed single dark identity (matches the pitch deck / product screens built in Claude Design) —
   not a light/dark pair. */
:root{
  --bg:#05060a;
  --surface:#0d0f14;
  --surface-2:#14161d;
  --border:#22262f;
  --border-soft:#1a1c22;
  --ink:#eef0f4;
  --ink-soft:#9aa2b1;
  --ink-faint:#7b8292;
  --primary:#f5b93d;
  --primary-strong:#ffd166;
  --primary-soft:#2a2210;
  --on-primary:#14110a;
  --good:#4cd68a;
  --good-soft:#12271c;
  --warn:#f5b93d;
  --warn-soft:#2a2210;
  --danger:#ef6461;
  --danger-soft:#2a1615;
  --shadow-color:0 0% 0%;
  --serif:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sans:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;}
html{color-scheme:dark;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;color:var(--ink);margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--primary);}
::selection{background:var(--primary);color:var(--on-primary);}
::placeholder{color:var(--ink-faint);opacity:1;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
*{scrollbar-color:var(--border) var(--bg);scrollbar-width:thin;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.shell{max-width:900px;margin:0 auto;padding:0 20px;}
.shell-wide{max-width:1120px;margin:0 auto;padding:0 20px;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{max-width:1120px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.topbar-progress{height:3px;background:var(--border-soft);}
.topbar-progress-fill{height:100%;background:var(--primary);transition:width .2s;}
.wordmark{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:none;padding:0;}
.wordmark-logo{width:38px;height:38px;border-radius:9px;display:block;flex:none;}
.wordmark-text-wrap{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;}
.wordmark-text{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-0.01em;}
.wordmark-byline{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);}
.topnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.topnav-mockname{font-size:13px;color:var(--ink-soft);padding:0 10px;border-right:1px solid var(--border);margin-right:2px;}
.avatar-btn{width:34px;height:34px;border-radius:99px;background:var(--primary);color:var(--on-primary);border:none;font-family:var(--sans);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:2px;transition:background .15s, transform .1s;}
.avatar-btn:hover{background:var(--primary-strong);}
.avatar-btn:active{transform:translateY(1px);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:8px;border:1px solid transparent;
  font-size:14px;font-weight:600;line-height:1;white-space:nowrap;
  transition:background .15s, border-color .15s, color .15s, transform .1s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:var(--on-primary);}
.btn-primary:hover{background:var(--primary-strong);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--ink-faint);}
.btn-text{background:none;border:none;color:var(--primary);font-weight:600;font-size:14px;padding:6px 4px;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px;}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Landing ---------- */
.hero{padding:64px 0 40px;}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.12;max-width:14ch;}
.hero-sub{margin-top:18px;font-size:17px;color:var(--ink-soft);max-width:52ch;line-height:1.6;}
.hero-cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.loop{
  margin-top:52px;display:flex;align-items:center;gap:0;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;
}
.loop-step{flex:1 1 140px;padding:20px 18px;position:relative;}
.loop-step + .loop-step{border-left:1px solid var(--border-soft);}
.loop-label{font-family:var(--serif);font-weight:600;font-size:16px;}
.loop-desc{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

.section{padding:56px 0;border-top:1px solid var(--border-soft);}
.section h2{font-size:24px;}
.section-lead{color:var(--ink-soft);margin-top:8px;max-width:56ch;font-size:14.5px;}
.causes-grid{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.cause-card{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;}
.cause-title{font-family:var(--serif);font-weight:600;font-size:15.5px;}
.cause-desc{font-size:13px;color:var(--ink-soft);margin-top:5px;}
.sd-wrap{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.sd-card{border:1px solid var(--border);background:var(--surface-2);border-radius:14px;padding:18px;}
.sd-card h3{font-size:16px;}
.sd-card ol{margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
.footnote{padding:28px 0 60px;font-size:12.5px;color:var(--ink-faint);border-top:1px solid var(--border-soft);}

/* ---------- Cards / surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;}
.card + .card{margin-top:14px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);
}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:1px;}
.field-hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
.form-title{font-size:21px;margin-bottom:4px;}
.form-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:24px;}

/* ---------- Chips (radios) ---------- */
.chiprow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{position:relative;}
.chip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.chip span{
  display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--border);font-size:12.5px;color:var(--ink-soft);background:var(--surface);
  transition:all .12s;
}
.chip input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600;}
.chip input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px;}
.chip .num{font-family:var(--mono);opacity:.8;font-size:11px;}

/* ---------- Question analysis ---------- */
.progressbar{height:6px;border-radius:99px;background:var(--border-soft);overflow:hidden;margin:14px 0 26px;}
.progressbar-fill{height:100%;background:var(--primary);transition:width .2s;}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.qcard{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;}
.qcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.qnum{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink);}
.qcard select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface);font-size:12.5px;}
.qcard .subrow{display:flex;gap:8px;margin-bottom:10px;}
.qcard .subrow input[type=text]{flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
.qcard .subrow input[type=number]{width:64px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
.qcard-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin:10px 0 6px;}
.qcard-label:first-of-type{margin-top:0;}
.reasons{display:block;}
.qcard:has(input[value="correct"]:checked) .reasons{display:none;}
.qcard.done{border-color:var(--good);background:color-mix(in srgb, var(--good-soft) 55%, var(--surface));}

/* ---------- Diagnosis ---------- */
.diag-hero{border:1px solid var(--primary-soft);background:var(--primary-soft);border-radius:12px;padding:20px 22px;margin-bottom:22px;}
.diag-hero p{color:var(--ink);font-size:14.5px;line-height:1.6;}
.diag-hero b{font-family:var(--serif);}
.catlist{display:flex;flex-direction:column;gap:12px;}
.catrow{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;gap:18px;align-items:flex-start;}
.catrank{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink-faint);width:28px;flex:none;}
.catrow-body{flex:1;min-width:0;}
.catrow-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.cattitle{font-family:var(--serif);font-weight:600;font-size:17px;}
.priority-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:99px;}
.priority-high{background:var(--danger-soft);color:var(--danger);}
.priority-medium{background:var(--warn-soft);color:var(--warn);}
.priority-low{background:var(--good-soft);color:var(--good);}
.catdesc{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
.catmeta{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;}
.catmeta div{font-size:12px;color:var(--ink-faint);}
.catmeta b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600;}
.catbar-track{height:6px;background:var(--border-soft);border-radius:99px;margin-top:12px;overflow:hidden;}
.catbar-fill{height:100%;background:var(--primary);}

/* ---------- Readiness radar ---------- */
.radar-section{display:flex;gap:30px;flex-wrap:wrap;align-items:center;}
.radar-chart-wrap{flex:none;line-height:0;max-width:100%;}
.radar-chart-wrap svg{display:block;max-width:100%;height:auto;}
.radar-side{flex:1 1 220px;min-width:200px;}
.radar-stat-label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);}
.radar-stat-value{font-family:var(--sans);font-weight:700;font-size:50px;color:var(--ink);line-height:1;margin-top:6px;}
.radar-stat-value sup{font-size:19px;font-weight:600;color:var(--ink-faint);margin-left:2px;top:-.6em;}
.radar-stat-note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;max-width:34ch;line-height:1.55;}
.radar-legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
.radar-legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);}
.legend-swatch{width:11px;height:11px;border-radius:99px;flex:none;display:inline-block;}
.legend-swatch.hollow{background:transparent;border:2px solid var(--ink-faint);}
.legend-swatch.filled{background:var(--primary);}
.radar-mini-table{margin-top:16px;}

/* ---------- Plan / calendar ---------- */
.plan-summary{display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:24px;}
.plan-progress-ring{display:flex;align-items:center;gap:10px;}
.plan-progress-num{font-family:var(--serif);font-size:28px;font-weight:700;}
.daylist{display:flex;flex-direction:column;gap:12px;}
.daycard{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px 18px;}
.daycard.special{background:var(--primary-soft);border-color:var(--primary-soft);}
.daycard-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.daycard-title{font-family:var(--serif);font-weight:600;font-size:15.5px;}
.daycard-date{font-size:12px;color:var(--ink-faint);font-family:var(--mono);}
.block{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--border-soft);cursor:pointer;}
.block:first-of-type{border-top:none;}
.block:hover .block-title{color:var(--primary);}
.block-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;}
.block-check.checked{background:var(--good);border-color:var(--good);color:#fff;}
.block-dot{width:7px;height:7px;border-radius:99px;flex:none;margin-top:6px;}
.block-body{flex:1;min-width:0;}
.block-title{font-size:13.5px;font-weight:600;color:var(--ink);}
.block-title.done{text-decoration:line-through;color:var(--ink-faint);}
.block-why{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.block-time{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);flex:none;margin-top:2px;}
.day-cta{margin-top:12px;}

/* ---------- Task overlay ---------- */
.overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;justify-content:flex-end;}
.overlay-panel{width:min(440px,100%);background:var(--surface);height:100%;overflow-y:auto;padding:26px 24px 40px;box-shadow:-8px 0 30px hsl(var(--shadow-color) / .25);}
.overlay-close{background:none;border:none;color:var(--ink-faint);font-size:14px;margin-bottom:18px;padding:4px 0;}
.timer-box{border:1px solid var(--border);border-radius:14px;background:var(--surface-2);padding:18px;text-align:center;margin:18px 0;}
.timer-num{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:.02em;}
.timer-controls{display:flex;gap:8px;justify-content:center;margin-top:12px;}
.checklist{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px;}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink-soft);}
.checklist input{margin-top:3px;}

/* ---------- Compare table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px;}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--border-soft);}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);background:var(--surface-2);}
td.num{font-family:var(--mono);text-align:right;}
td.change-pos{color:var(--good);font-weight:600;}
td.change-neg{color:var(--danger);font-weight:600;}
tr:last-child td{border-bottom:none;}

/* ---------- Profile / dashboard ---------- */
.stat-row{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.stat-tile{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px 18px;}
.stat-num{font-size:28px;font-weight:700;color:var(--ink);line-height:1.1;}
.stat-label{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.stat-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.mock-history{display:flex;flex-direction:column;gap:10px;}
.mock-row{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.mock-row-name{font-family:var(--serif);font-weight:600;font-size:14.5px;}
.mock-row-meta{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.mock-row-actions{display:flex;gap:8px;flex-wrap:wrap;}
.role-pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);border:1px solid var(--border);border-radius:99px;padding:2px 7px;margin-left:6px;}

/* ---------- misc ---------- */
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:12px 16px;font-size:13px;margin-bottom:20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;}
.page{padding:36px 0 64px;}
.page-back{font-size:13px;color:var(--ink-soft);background:none;border:none;padding:0 0 18px;display:inline-flex;align-items:center;gap:5px;}
.helper{font-size:12.5px;color:var(--ink-faint);margin-top:20px;}
.divider{height:1px;background:var(--border-soft);margin:26px 0;}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.pwa-install-btn{
  position:fixed;right:18px;bottom:18px;z-index:60;
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:99px;border:none;
  background:var(--primary);color:var(--on-primary);
  font-family:var(--sans);font-weight:700;font-size:13.5px;
  box-shadow:0 8px 24px hsl(var(--shadow-color) / .4);
  cursor:pointer;
}
.pwa-install-btn:hover{background:var(--primary-strong);}
@media (max-width:640px){
  .pwa-install-btn{right:14px;bottom:14px;padding:10px 16px;font-size:13px;}
}
@media (max-width:640px){
  .catrow{flex-direction:column;gap:8px;}
  .catrank{width:auto;}
  .qgrid{grid-template-columns:1fr;}
}
</style>

<div id="app"></div>
<button id="pwaInstallBtn" class="pwa-install-btn" hidden>⬇ Install app</button>

<script>

/* ---------------- state ---------------- */
function emptyState(){
  return { route:'landing', routeParams:{}, mocks:[], plans:[], demo:false, profile:{name:'',examTarget:'',notifyEnabled:false} };
}
var state = load();

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return emptyState();
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.mocks)) return emptyState();
    parsed.route = 'landing'; parsed.routeParams = {}; parsed.demo=false;
    if(!parsed.profile) parsed.profile = {name:'',examTarget:'',notifyEnabled:false};
    if(!Array.isArray(parsed.plans)) parsed.plans = [];
    return parsed;
  }catch(e){ return emptyState(); }
}
function persist(){
  if(state.demo) return;
  try{
    var toSave = {mocks:state.mocks, plans:state.plans, profile:state.profile};
    localStorage.setItem(STORE_KEY, JSON.stringify(toSave));
  }catch(e){ /* storage unavailable - continue in-memory */ }
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function findMock(id){ return state.mocks.find(function(m){return m.id===id;}); }
function findPlan(mockId){ return state.plans.find(function(p){return p.mockId===mockId;}); }

/* ---------------- scoring / allocation ---------------- */
function computeScores(questions){
  var scores={}, affected={};
  CATEGORIES.forEach(function(c){ scores[c.id]=0; affected[c.id]=new Set(); });
  questions.forEach(function(q, idx){
    if(!q.result || q.result==='correct') return;
    var w = WEIGHTS[q.result]; if(!w) return;
    if(q.primary && scores.hasOwnProperty(q.primary)){ scores[q.primary]+=w.primary; affected[q.primary].add(idx); }
    if(q.secondary && scores.hasOwnProperty(q.secondary)){ scores[q.secondary]+=w.secondary; affected[q.secondary].add(idx); }
  });
  return CATEGORIES.map(function(c){
    return {id:c.id, label:c.label, product:c.product, desc:c.desc,
      score: Math.round(scores[c.id]*100)/100, affectedCount: affected[c.id].size};
  });
}

function finalizeAllocation(active, raw, base, remaining){
  var floors = raw.map(Math.floor);
  var used = floors.reduce(function(a,b){return a+b;},0);
  var leftover = remaining - used;
  var order = raw.map(function(r,i){ return {i:i, rem:r-floors[i]}; }).sort(function(a,b){ return b.rem-a.rem; });
  for(var k=0;k<leftover;k++){ floors[order[k % order.length].i]+=1; }
  return active.map(function(c,i){ return Object.assign({}, c, {blocks: base+floors[i]}); });
}

function allocateBlocks(catScores, totalBlocks, basePerCat){
  var active = catScores.filter(function(c){ return c.score>0; });
  if(active.length===0) return [];
  var baseTotal = active.length*basePerCat;
  var base = basePerCat;
  var remaining = totalBlocks - baseTotal;
  if(remaining < 0){ base = 1; remaining = totalBlocks - active.length; }
  var totalScore = active.reduce(function(s,c){ return s+c.score; },0);
  var raw = active.map(function(c){ return totalScore>0 ? remaining*c.score/totalScore : remaining/active.length; });
  return finalizeAllocation(active, raw, base, remaining);
}

function scheduleBlocks(allocation, days, slotsPerDay){
  var pool=[];
  allocation.forEach(function(a){ for(var i=0;i<a.blocks;i++) pool.push(a.id); });
  var totalSlots = days*slotsPerDay;
  while(pool.length < totalSlots) pool.push('mixed');
  var counts={}; pool.forEach(function(id){ counts[id]=(counts[id]||0)+1; });
  var schedule=[], prev=null;
  for(var s=0;s<totalSlots;s++){
    var candidates = Object.keys(counts).filter(function(id){ return counts[id]>0; });
    candidates.sort(function(a,b){ return counts[b]-counts[a]; });
    var choice = candidates.filter(function(id){ return id!==prev; })[0];
    if(choice===undefined) choice = candidates[0];
    counts[choice]--; schedule.push(choice); prev=choice;
  }
  return schedule;
}

function chaptersForCategory(questions, catId){
  var list=[];
  questions.forEach(function(q){
    if(q.result && q.result!=='correct' && (q.primary===catId || q.secondary===catId) && q.chapter && q.chapter.trim()){
      list.push(q.chapter.trim());
    }
  });
  return list;
}

function blockContent(catId, chapter){
  switch(catId){
    case 'language': return {title:'Textbook clarity session', time:30,
      instr:'Read the NCERT (or your primary textbook) section on '+(chapter||'the topic that tripped you up')+' for at least 30 minutes. Focus only on definitions, stated conditions and exact wording — not problem-solving.',
      checks:['Wrote 3 key statements or conditions in your own words','Underlined every technical term you were unsure of','Re-read the original mock question — does it make sense now?']};
    case 'situation': return {title:'Situation decoding drill', time:35,
      instr:'Solve 2 unfamiliar situation-based questions'+(chapter?(' from '+chapter):'')+'. Before attempting each, write down: known information, unknown quantity, a quick diagram, and the applicable principle — in that order.',
      checks:['Identified known vs unknown before solving','Sketched or visualised the situation first','Named the applicable principle before calculating anything']};
    case 'approach': return {title:'Approach-building drill', time:35,
      instr:'Attempt 2 unfamiliar questions'+(chapter?(' from '+chapter):'')+'. Spend at least 15 minutes on each before looking at any hint or solution.',
      checks:['Recorded your first attempted step','Recorded the actual first useful step, after checking','Noted the method that was ultimately needed']};
    case 'formula': return {title:'Formula recall & derivation', time:30,
      instr:'Revise the formula or law you missed'+(chapter?(' in '+chapter):'')+'. Derive it from first principles where possible, then close your notes and test recall from memory alone.',
      checks:['Built a formula card: formula, meaning, conditions, derivation cue','Recalled it once with notes fully closed','Reapplied it to the original mock question']};
    case 'silly': return {title:'20-minute accuracy test mode', time:20,
      instr:'Solve 10 questions'+(chapter?(' covering '+chapter+' and similar topics'):'')+' in 20 minutes — no notes, no hints, no pausing. After the set, label every error: sign, unit, arithmetic, reading, option-marking, or setup.',
      checks:['Completed all 10 within 20 minutes with no outside help','Labelled every error by its exact type','Noted the single most frequent error type below']};
    case 'time': return {title:'Search-and-Destroy time drill', time:40,
      instr:'Run one timed set under exam conditions. First pass: classify every question A (fast), B (solvable, slower) or C (unclear). Solve all A questions first, then B in order of expected marks per minute. Leave C for last, and reserve the final 5–10 minutes only for checking.',
      checks:['Classified every question before solving any of them','Solved A questions first, then B by marks-per-minute','Reserved at least 5 minutes purely for checking']};
    default: return {title:'Mixed spaced-revision block', time:30,
      instr:'No single category dominated here — use this block for a short mixed-topic revision set covering whatever feels least fresh in your notes.',
      checks:['Reviewed at least two different chapters','Flagged anything that needs a longer look later']};
  }
}

/* ---------------- readiness radar ---------------- */
function computePreparedness(mock){
  var scores = computeScores(mock.questions);
  var n = mock.numQuestions || NUM_Q;
  var items = CATEGORIES.map(function(c){
    var s = scores.find(function(x){ return x.id===c.id; });
    var raw = 100 - (s.score / n * 100);
    var prep = Math.round(Math.max(0, Math.min(100, raw)));
    return {id:c.id, label:c.label, prep:prep};
  });
  var overall = Math.round(items.reduce(function(a,b){ return a+b.prep; },0) / items.length);
  return {items:items, overall:overall};
}

function hexPt(cx,cy,R,axisIndex,value){
  var angle = (-90 + axisIndex*60) * Math.PI/180;
  var r = (Math.max(0,Math.min(100,value))/100) * R;
  return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
}
function ptsStr(pts){ return pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); }

function buildRadarSVG(series, opts){
  opts = opts || {};
  var svgW=440, svgH=272, cx=svgW/2, cy=svgH/2-4, R=86;
  var svg = '<svg viewBox="0 0 '+svgW+' '+svgH+'" width="'+svgW+'" height="'+svgH+'" role="img" aria-label="'+esc(opts.ariaLabel||'Preparedness across six fronts')+'">';
  [25,50,75,100].forEach(function(ring){
    var pts = CATEGORIES.map(function(c,i){ return hexPt(cx,cy,R,i,ring); });
    svg += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:var(--border);stroke-width:1;" />';
  });
  CATEGORIES.forEach(function(c,i){
    var edge = hexPt(cx,cy,R,i,100);
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+edge[0].toFixed(1)+'" y2="'+edge[1].toFixed(1)+'" style="stroke:var(--border);stroke-width:1;" />';
    var lp = hexPt(cx,cy,R+26,i,100);
    var angle = -90 + i*60;
    var cosA = Math.cos(angle*Math.PI/180);
    var anchor = cosA>0.3 ? 'start' : (cosA<-0.3 ? 'end' : 'middle');
    var dy = (angle===-90) ? -2 : (angle===90 ? 11 : 4);
    svg += '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+dy).toFixed(1)+'" text-anchor="'+anchor+'" style="font-family:var(--sans);font-size:10.5px;fill:var(--ink-soft);">'+esc(c.label)+'</text>';
  });
  series.forEach(function(s){
    var pts = s.values.map(function(v,i){ return hexPt(cx,cy,R,i,v); });
    if(s.filled){
      svg += '<polygon points="'+ptsStr(pts)+'" style="fill:var('+s.colorVar+');fill-opacity:0.14;stroke:var('+s.colorVar+');stroke-width:2;stroke-linejoin:round;" />';
    } else {
      svg += '<polygon points="'+ptsStr(pts)+'" style="fill:none;stroke:var('+s.colorVar+');stroke-width:2;stroke-linejoin:round;" />';
    }
    pts.forEach(function(p){
      svg += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" style="fill:var('+s.colorVar+');stroke:var(--surface);stroke-width:2;" />';
    });
  });
  var last = series[series.length-1];
  if(last){
    var minIdx=0; last.values.forEach(function(v,i){ if(v<last.values[minIdx]) minIdx=i; });
    var out = hexPt(cx,cy,R+13,minIdx,100);
    svg += '<text x="'+out[0].toFixed(1)+'" y="'+out[1].toFixed(1)+'" text-anchor="middle" style="font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink);">'+last.values[minIdx]+'</text>';
  }
  svg += '</svg>';
  return svg;
}
function buildProgressRing(pct, size){
  size = size || 52;
  var stroke = 5, r = (size-stroke)/2, c = 2*Math.PI*r;
  pct = Math.max(0, Math.min(100, pct));
  var off = c * (1 - pct/100);
  var cx = size/2, cy = size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+pct+'% of blocks completed" style="flex:none;">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border-soft)" stroke-width="'+stroke+'" />'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--primary)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" />'+
    '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" style="font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink);">'+pct+'%</text>'+
  '</svg>';
}

function priorityForRank(rank){
  if(rank<=2) return 'high';

/* ---------------- plan generation ---------------- */
function buildPlan(mock){
  var scores = computeScores(mock.questions);
  var allocation = allocateBlocks(scores, 24, 2);
  var schedule = scheduleBlocks(allocation, 12, 2); // 24 slots -> days 2..13
  var perCatIndex = {};
  var startDate = new Date(mock.date || Date.now());
  var blocks = schedule.map(function(catId, i){
    var day = 2 + Math.floor(i/2); // 2..13
    perCatIndex[catId] = (perCatIndex[catId]||0);
    var chapters = catId==='mixed' ? [] : chaptersForCategory(mock.questions, catId);
    var chapter = chapters.length ? chapters[perCatIndex[catId] % chapters.length] : null;
    perCatIndex[catId]++;
    var content = blockContent(catId, chapter);
    var d = new Date(startDate); d.setDate(d.getDate() + (day-1));
    return {
      id: uid(), day:day, slot: (i%2), catId:catId,
      title: content.title, timeMin: content.time, instr: content.instr, checks: content.checks,
      chapter: chapter, dateLabel: fmtDate(d),
      completed:false, reflection:''
    };
  });
  return {
    id: uid(), mockId: mock.id, startDate: mock.date,
    blocks: blocks, checkpointDone:false, checkpointQuestions:null,
    followupMockId:null
  };
}

function reallocateFromCheckpoint(plan, checkpointQuestions){
  var scores = computeScores(checkpointQuestions.map(function(q){ return {result:q.result, primary:q.primary, secondary:null}; }));
  var allocation = allocateBlocks(scores, 12, 1); // days 8-13, 2 slots x 6 days
  var schedule = scheduleBlocks(allocation, 6, 2);
  var perCatIndex = {};
  var mock = findMock(plan.mockId);
  var startDate = new Date(plan.startDate || Date.now());
  var newBlocks = schedule.map(function(catId, i){
    var day = 8 + Math.floor(i/2);
    perCatIndex[catId] = (perCatIndex[catId]||0);
    var chapters = catId==='mixed' ? [] : chaptersForCategory(mock.questions, catId);
    var chapter = chapters.length ? chapters[perCatIndex[catId] % chapters.length] : null;
    perCatIndex[catId]++;
    var content = blockContent(catId, chapter);
    var d = new Date(startDate); d.setDate(d.getDate() + (day-1));
    return {
      id: uid(), day:day, slot:(i%2), catId:catId,
      title: content.title, timeMin: content.time, instr: content.instr, checks: content.checks,
      chapter: chapter, dateLabel: fmtDate(d),
      completed:false, reflection:''
    };
  });
  plan.blocks = plan.blocks.filter(function(b){ return b.day<8; }).concat(newBlocks);
  plan.checkpointDone = true;
  plan.checkpointQuestions = checkpointQuestions;
}

/* ---------------- helpers ---------------- */
function fmtDate(d){
  if(!(d instanceof Date)) d = new Date(d);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pct(n){ return Math.round(n*10)/10; }

function demoMock(){
  var subs=['Physics','Chemistry','Mathematics'], chapters={
    Physics:['Rotational Motion','Electrostatics','Modern Physics','Kinematics'],
    Chemistry:['Chemical Bonding','Equilibrium','Organic — GOC'],
    Mathematics:['Probability','Coordinate Geometry','Definite Integrals']
  };
  var pattern = [
    ['wrong','approach','formula'],['correct',null,null],['left','time',null],['wrong','silly','approach'],
    ['slow','time',null],['wrong','approach',null],['correct',null,null],['wrong','formula','silly'],
    ['guessed','approach',null],['wrong','approach','situation'],['correct',null,null],['left','time',null],
    ['wrong','silly',null],['wrong','approach','formula'],['correct',null,null],['slow','time','silly'],
    ['wrong','formula',null],['left','approach',null],['correct',null,null],['wrong','silly',null],
    ['guessed','approach','language'],['wrong','approach',null],['correct',null,null],['left','time','approach'],

  var qs = pattern.map(function(p,i){

    var g = function(id){ return document.getElementById(id); };

    };

  fieldChange: function(target){
    var path = target.dataset.field; if(!path) return;
    var parts = path.split('.');
    if(parts[0]==='q'){
      var qi = Number(parts[1]), field = parts[2];
      var mockId = state.routeParams.mockId;
      var mock = findMock(mockId); if(!mock) return;
      var q = mock.questions[qi];
      var val = target.value;
      if(field==='time') val = val===''? null : Number(val);
      if((field==='primary'||field==='secondary') && val==='') val=null;
      if(field==='primary' && q.secondary===val) q.secondary=null;
      q[field]=val;
      if(field==='result' && val==='correct'){
        q.primary=null; q.secondary=null;
        var card = document.getElementById('qcard-'+qi);
        if(card){ card.querySelectorAll('.reasons input[type=radio]').forEach(function(r){ r.checked = (r.value===''); }); }
      }
      persist();
      App.refreshProgress();
      if(field==='result'){ App.refreshCardDone(qi); }
    }
    if(parts[0]==='cp'){
      var idx=Number(parts[1]), f=parts[2];
      var cp = state.routeParams._cpDraft;
      if(!cp) return;
      var val2 = target.value;
      if(f==='primary' && val2==='') val2=null;
      cp[idx][f]=val2;
      if(f==='result' && val2!=='wrong' && val2!=='left'){ cp[idx].primary=null; }
      render();
    }
  },
  refreshProgress: function(){
    var mock = findMock(state.routeParams.mockId); if(!mock) return;
    var done = mock.questions.filter(function(q){return q.result;}).length;
    var badge = document.getElementById('progressBadge');
    if(badge) badge.textContent = done+' of '+NUM_Q+' completed';
    var fill = document.getElementById('progressFill');
    if(fill) fill.style.width = (done/NUM_Q*100)+'%';
    var stickyFill = document.getElementById('topbarProgressFill');
    if(stickyFill) stickyFill.style.width = (done/NUM_Q*100)+'%';
    var btn = document.getElementById('genPlanBtn');
    if(btn) btn.disabled = done < NUM_Q;
  },
  refreshCardDone: function(qi){
    var mock = findMock(state.routeParams.mockId); if(!mock) return;
    var card = document.getElementById('qcard-'+qi);
    if(card){ card.classList.toggle('done', !!mock.questions[qi].result); }
  },

  generatePlan: function(){
    var mock = findMock(state.routeParams.mockId); if(!mock) return;
    var incomplete = mock.questions.some(function(q){return !q.result;});
    if(incomplete) return;
    if(mock.role==='followup'){
      persist();
      nav('compare', {mockId: mock.linkedMockId, followupId: mock.id});
      return;
    }
    var plan = buildPlan(mock);
    state.plans.push(plan);
    persist();
    nav('diagnosis', {mockId:mock.id});
  },

  openTask: function(el){
    state.routeParams.taskId = el.dataset.id;
    render();
  },
  closeTask: function(){
    delete state.routeParams.taskId;
    render();
  },
  toggleComplete: function(el){
    var plan = findPlan(state.routeParams.mockId); if(!plan) return;
    var block = plan.blocks.find(function(b){return b.id===el.dataset.id;});
    if(!block) return;
    block.completed = !block.completed;
    if(block.completed){
      var ta = document.getElementById('reflectInput');
      if(ta) block.reflection = ta.value;
    }
    persist();
    delete state.routeParams.taskId;
    render();
  },

  startCheckpoint: function(){
    state.routeParams._cpDraft = Array.from({length:8}, function(){ return {result:'', primary:null}; });
    state.routeParams.checkpointMode = true;
    render();
  },
  cancelCheckpoint: function(){
    delete state.routeParams._cpDraft;
    delete state.routeParams.checkpointMode;
    render();
  },
  submitCheckpoint: function(){
    var cp = state.routeParams._cpDraft;
    var incomplete = !cp || cp.some(function(q){
      if(!q.result) return true;
      if((q.result==='wrong'||q.result==='left') && !q.primary) return true;
      return false;
    });
    if(incomplete) return;
    var plan = findPlan(state.routeParams.mockId); if(!plan) return;
    reallocateFromCheckpoint(plan, cp);
    persist();
    delete state.routeParams._cpDraft;
    delete state.routeParams.checkpointMode;
    render();
  },

  exportData: function(){
    var data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      profile: state.profile,
      mocks: state.mocks.filter(function(m){ return m.id!=='demo'; }),
      plans: state.plans.filter(function(p){ return p.mockId!=='demo'; })
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'mock-to-marks-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  },
  triggerImport: function(){
    var inp = document.getElementById('importFileInput');
    if(inp) inp.click();
  },
  importData: function(el){
    var file = el.files && el.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(String(reader.result));
        if(!data || typeof data!=='object' || !Array.isArray(data.mocks) || !Array.isArray(data.plans)){
          throw new Error('unrecognised backup format');
        }
        var existingMockIds = {}; state.mocks.forEach(function(m){ existingMockIds[m.id]=true; });
        var newMocks = data.mocks.filter(function(m){
          return m && typeof m==='object' && typeof m.id==='string' && typeof m.name==='string' && Array.isArray(m.questions) && !existingMockIds[m.id];
        });
        var existingPlanIds = {}; state.plans.forEach(function(p){ existingPlanIds[p.id]=true; });
        var newPlans = data.plans.filter(function(p){
          return p && typeof p==='object' && typeof p.id==='string' && Array.isArray(p.blocks) && !existingPlanIds[p.id];
        });
        if(newMocks.length===0 && newPlans.length===0){
          window.alert('Nothing new to import — this backup’s mocks and plans are already on this device.');
          el.value=''; return;
        }
        if(!window.confirm('Import '+newMocks.length+' mock(s) and '+newPlans.length+' plan(s) from this file? Existing data on this device is kept as-is.')) { el.value=''; return; }
        state.mocks = state.mocks.concat(newMocks);
        state.plans = state.plans.concat(newPlans);
        if(data.profile && typeof data.profile==='object'){
          state.profile = state.profile || {name:'',examTarget:''};
          if(!state.profile.name && typeof data.profile.name==='string') state.profile.name = data.profile.name;
          if(!state.profile.examTarget && typeof data.profile.examTarget==='string') state.profile.examTarget = data.profile.examTarget;
        }
        persist();
        render();
      }catch(e){
        window.alert('This file could not be read as a Mock-to-Marks backup.');
      }
      el.value='';
    };
    reader.readAsText(file);
  },

  toggleReminders: function(el){
    if(el.checked){
      if(!('Notification' in window)){
        window.alert('Notifications are not supported in this browser.');
        el.checked=false; return;
      }
      Notification.requestPermission().then(function(perm){
        state.profile = state.profile || {};
        if(perm==='granted'){ state.profile.notifyEnabled = true; App.maybeNotifyToday(); }
        else { state.profile.notifyEnabled = false; el.checked=false; }
        persist();
      });
    } else {
      state.profile = state.profile || {};
      state.profile.notifyEnabled = false;
      persist();
    }
  },
  maybeNotifyToday: function(){
    if(!state.profile || !state.profile.notifyEnabled) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    var todayKey = new Date().toISOString().slice(0,10);
    var todaysBlock = null;
    state.plans.forEach(function(p){
      if(todaysBlock || p.mockId==='demo') return;
      var start = new Date(p.startDate || Date.now());
      p.blocks.forEach(function(b){
        if(todaysBlock || b.completed) return;
        var d = new Date(start); d.setDate(d.getDate() + (b.day-1));
        if(d.toISOString().slice(0,10)===todayKey) todaysBlock = b;
      });
    });
    if(todaysBlock){
      try{ new Notification('Today’s Mock-to-Marks block', {body: todaysBlock.title+' — '+todaysBlock.timeMin+' min', icon:'icon-192.png'}); }catch(e){}
    }
  }
};

    var checked = current===c.id ? 'checked' : '';
    return '<label class="chip"><input type="radio" name="'+name+qi+'" value="'+c.id+'" data-field="q.'+qi+'.'+(name.indexOf('sec')===0?'secondary':'primary')+'" '+checked+'><span><span class="num">'+(i+1)+'</span> '+c.label+'</span></label>';
  }).join('');
}

function questionCard(q, qi){
  var resultChips = RESULTS.map(function(r){
    var checked = q.result===r.id ? 'checked' : '';
    return '<label class="chip"><input type="radio" name="res'+qi+'" value="'+r.id+'" data-field="q.'+qi+'.result" '+checked+'><span>'+r.label+'</span></label>';

/* ---------------- dashboard computation ---------------- */
function realMocks(){ return state.mocks.filter(function(m){ return m.id!=='demo'; }); }
function realPlans(){ return state.plans.filter(function(p){ return p.mockId!=='demo'; }); }

function computeStreak(plans){
  var doneDates = {};
  plans.forEach(function(p){
    var start = new Date(p.startDate || Date.now());
    p.blocks.forEach(function(b){
      if(!b.completed) return;
      var d = new Date(start); d.setDate(d.getDate() + (b.day-1));
      doneDates[d.toISOString().slice(0,10)] = true;
    });
  });
  var cursor = new Date(); cursor.setHours(0,0,0,0);
  if(!doneDates[cursor.toISOString().slice(0,10)]) cursor.setDate(cursor.getDate()-1);
  var streak = 0;
  while(doneDates[cursor.toISOString().slice(0,10)]){
    streak++; cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeDashboard(){
  var mocks = realMocks(), plans = realPlans();
  var totalBlocks=0, doneBlocks=0;
  plans.forEach(function(p){ p.blocks.forEach(function(b){ totalBlocks++; if(b.completed) doneBlocks++; }); });
  var agg = {}; CATEGORIES.forEach(function(c){ agg[c.id] = {score:0, affected:0}; });
  var analysed = 0;
  mocks.forEach(function(m){
    if(!m.questions.every(function(q){ return q.result; })) return;
    analysed++;
    computeScores(m.questions).forEach(function(c){ agg[c.id].score += c.score; agg[c.id].affected += c.affectedCount; });
  });
  var aggList = CATEGORIES.map(function(c){
    return {id:c.id, label:c.label, score:Math.round(agg[c.id].score*100)/100, affected:agg[c.id].affected};
  }).filter(function(c){ return c.score>0; }).sort(function(a,b){ return b.score-a.score; });
  var maxScore = aggList.length ? aggList[0].score : 0;
  return {
    mocks: mocks, plans: plans, analysedMocks: analysed,
    totalBlocks: totalBlocks, doneBlocks: doneBlocks,
    completionPct: totalBlocks ? Math.round(doneBlocks/totalBlocks*100) : 0,
    aggList: aggList, maxScore: maxScore,
    streak: computeStreak(plans)
  };
}

/* ---------------- view: profile / dashboard ---------------- */
function viewProfile(){
  var p = state.profile || {name:'',examTarget:''};
  var dash = computeDashboard();
  var mocksSorted = dash.mocks.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  var statTiles = [
    {label:'Mocks analysed', value: dash.mocks.length},
    {label:'Plans generated', value: dash.plans.length},
    {label:'Blocks completed', value: dash.completionPct+'%', sub: dash.doneBlocks+' of '+dash.totalBlocks},
    {label:'Current streak', value: dash.streak+(dash.streak===1?' day':' days')}
  ].map(function(s){
    return '<div class="stat-tile"><div class="stat-num mono">'+s.value+'</div><div class="stat-label">'+s.label+'</div>'+(s.sub?'<div class="stat-sub mono">'+esc(s.sub)+'</div>':'')+'</div>';
  }).join('');

  var weakFronts = dash.aggList.length ? dash.aggList.map(function(c,i){
    var barPct = dash.maxScore>0 ? Math.round(c.score/dash.maxScore*100) : 0;
    return '<div class="catrow" style="padding:14px 16px;">'+
      '<div class="catrow-body">'+
        '<div class="catrow-top"><span class="cattitle" style="font-size:14.5px;">'+c.label+'</span><span style="font-size:12px;color:var(--ink-faint);">'+c.affected+' question'+(c.affected===1?'':'s')+' across your mocks</span></div>'+
        '<div class="catbar-track" style="margin-top:10px;"><div class="catbar-fill" style="width:'+barPct+'%;"></div></div>'+
      '</div></div>';
  }).join('') : '<div class="empty" style="padding:30px 20px;">Finish analysing at least one mock to see your recurring weak fronts here.</div>';

  var mockRows = mocksSorted.length ? mocksSorted.map(function(m){
    var plan = findPlan(m.id);
    var complete = m.questions.every(function(q){ return q.result; });
    return '<div class="mock-row">'+
      '<div class="mock-row-main">'+
        '<div class="mock-row-name">'+esc(m.name)+(m.role==='followup'?' <span class="role-pill">follow-up</span>':'')+'</div>'+
        '<div class="mock-row-meta mono">'+fmtDate(m.date)+' &middot; '+m.marksScored+'/'+m.targetMarks+' marks'+(complete?'':' &middot; incomplete')+'</div>'+
      '</div>'+
      '<div class="mock-row-actions">'+
        (complete ? '<button class="btn btn-ghost btn-sm" data-action="toDiagnosis" data-id="'+m.id+'">Diagnosis</button>' : '<button class="btn btn-ghost btn-sm" data-action="toAnalyze" data-id="'+m.id+'">Continue</button>')+
        (plan ? '<button class="btn btn-ghost btn-sm" data-action="toCalendar" data-id="'+m.id+'">Plan</button>' : '')+
        '<button class="btn btn-danger btn-sm" data-action="deleteMock" data-id="'+m.id+'" title="Delete this mock">Delete</button>'+
      '</div>'+
    '</div>';
  }).join('') : '<div class="empty" style="padding:30px 20px;">No mocks yet. <button class="btn btn-text" data-action="toCreate">Analyse your first mock →</button></div>';

  return topbar() + '<div class="shell page">'+
    '<button class="page-back" data-action="toLanding">← Back</button>'+
    '<h2 style="font-size:23px;">Your profile</h2>'+
    '<p class="section-lead" style="margin-top:4px;">Stored only on this device, in your browser. No account, no server — export a backup if you want a copy elsewhere.</p>'+

    '<div class="card" style="margin-top:22px;">'+
      '<div class="field-row">'+
        '<div class="field" style="margin-bottom:0;"><label for="p_name">Name</label><input type="text" id="p_name" value="'+esc(p.name)+'" placeholder="e.g. Rohan Verma"></div>'+
        '<div class="field" style="margin-bottom:0;"><label for="p_target">Target exam</label><input type="text" id="p_target" value="'+esc(p.examTarget)+'" placeholder="e.g. JEE Main 2027"></div>'+
      '</div>'+
      '<button class="btn btn-primary btn-sm" data-action="saveProfile" style="margin-top:16px;">Save</button>'+
    '</div>'+

    '<div class="stat-row">'+statTiles+'</div>'+

    '<div class="section" style="padding-top:36px;border-top:none;">'+
      '<h2>Where marks keep slipping</h2>'+
      '<p class="section-lead">Aggregated across every fully-analysed mock — not just your latest one.</p>'+
      '<div class="catlist" style="margin-top:16px;">'+weakFronts+'</div>'+
    '</div>'+

    '<div class="section">'+
      '<h2>Your mocks</h2>'+
      '<div class="mock-history" style="margin-top:16px;">'+mockRows+'</div>'+
    '</div>'+

    '<div class="section">'+
      '<h2>Reminders</h2>'+
      '<p class="section-lead">Best-effort: this notifies you when you open the app on a day you have an unfinished block. It cannot notify you while the app is fully closed.</p>'+
      '<label style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13.5px;color:var(--ink);cursor:pointer;">'+
        '<input type="checkbox" id="notifyToggle" onchange="App.toggleReminders(this)" '+(p.notifyEnabled?'checked':'')+' style="width:17px;height:17px;">'+
        'Remind me about today’s plan block when I open the app'+
      '</label>'+
    '</div>'+

    '<div class="section">'+
      '<h2>Your data</h2>'+
      '<p class="section-lead">Export a backup file, restore one on a new device, or clear everything on this device.</p>'+
      '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">'+
        '<button class="btn btn-ghost" data-action="exportData">Export backup (.json)</button>'+
        '<button class="btn btn-ghost" data-action="triggerImport">Import backup</button>'+
        '<input type="file" id="importFileInput" accept="application/json" hidden onchange="App.importData(this)">'+
        (state.mocks.length ? '<button class="btn btn-danger" data-action="startFresh">Clear all data</button>' : '')+
      '</div>'+
    '</div>'+
  '</div>';
}

/* simple timer, isolated so overlay markup stays string-based */
var TimerApp = (function(){
  var remaining=0, interval=null, running=false;
  function render2(){
    var el=document.getElementById('timerDisplay'); if(!el) return;
    var m=Math.floor(remaining/60), s=remaining%60;
    el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  return {
    reset:function(minutes){ clearInterval(interval); running=false; remaining=minutes*60; render2();
      var btn=document.getElementById('timerToggleBtn'); if(btn) btn.textContent='Start'; },
    toggle:function(){
      var btn=document.getElementById('timerToggleBtn');
      if(!remaining){ var disp=document.getElementById('timerDisplay'); if(disp){ var parts=disp.textContent.split(':'); remaining=Number(parts[0])*60+Number(parts[1]); } }
      if(running){ clearInterval(interval); running=false; if(btn) btn.textContent='Start'; return; }
      running=true; if(btn) btn.textContent='Pause';
      interval=setInterval(function(){
        remaining=Math.max(0,remaining-1); render2();
        if(remaining<=0){ clearInterval(interval); running=false; if(btn) btn.textContent='Start'; }
      },1000);
    }
  };
})();
window.TimerApp = TimerApp;

/* ---------------- view: compare ---------------- */
function viewCompare(){
  var mock = findMock(state.routeParams.mockId);
  var plan = mock && findPlan(mock.id);
  var followupId = state.routeParams.followupId || (plan && plan.followupMockId);
  var followup = followupId ? findMock(followupId) : null;

  if(followup && plan && plan.followupMockId !== followup.id){
    plan.followupMockId = followup.id; persist();
  }

  if(!mock || !followup) return topbar()+'<div class="shell page"><div class="empty">Comparison not ready yet.</div></div>';

  var s1 = computeScores(mock.questions), s2 = computeScores(followup.questions);
  function acc(m){
    var attempted = m.questions.filter(function(q){return q.result && q.result!=='left';});
    var correct = attempted.filter(function(q){return q.result==='correct'||q.result==='slow'||q.result==='guessed';});
    return attempted.length ? Math.round(correct.length/attempted.length*1000)/10 : 0;
  }
  var acc1=acc(mock), acc2=acc(followup);
  var marksDelta = followup.marksScored - mock.marksScored;
  var accDelta = Math.round((acc2-acc1)*10)/10;

  var top3 = s1.filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,3);
  var rows = top3.map(function(c){
    var c2 = s2.find(function(x){return x.id===c.id;});
    var loss1 = c.affectedCount*mock.marksPerQ, loss2=c2.affectedCount*followup.marksPerQ;
    var recovered = loss1-loss2;
    return {label:c.label, loss1:loss1, loss2:loss2, recovered:recovered};
  });
  var biggestGain = rows.slice().sort(function(a,b){b.recovered-a.recovered; return b.recovered-a.recovered;})[0];
  var stillOpen = s2.filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score;})[0];

  var takeaway = 'You '+(marksDelta>=0?'gained ':'lost ')+Math.abs(marksDelta)+' marks.'+
    (biggestGain && biggestGain.recovered>0 ? ' Your largest improvement came from '+biggestGain.label.toLowerCase()+'.' : '')+
    (stillOpen ? ' Your next cycle should keep an eye on '+stillOpen.label.toLowerCase()+'.' : '');

  var prep1 = computePreparedness(mock), prep2 = computePreparedness(followup);
  var prepDelta = prep2.overall - prep1.overall;
  var radarSvg2 = buildRadarSVG([
    {values: prep1.items.map(function(i){return i.prep;}), colorVar:'--ink-faint', filled:false},
    {values: prep2.items.map(function(i){return i.prep;}), colorVar:'--primary', filled:true}
  ], {ariaLabel:'Readiness comparison, day 1 versus day 14'});

  return topbar() + '<div class="shell page">'+
    '<button class="page-back" data-action="toCalendar" data-id="'+mock.id+'">← Plan</button>'+
    '<h2 style="font-size:22px;">Day 1 vs Day 14 — '+esc(mock.name)+'</h2>'+
    '<div class="card radar-section" style="margin-top:20px;">'+
      '<div class="radar-chart-wrap">'+radarSvg2+'</div>'+
      '<div class="radar-side">'+
        '<div class="radar-stat-label">Readiness index</div>'+
        '<div class="radar-stat-value">'+prep2.overall+'<sup>/100</sup></div>'+
        '<div class="radar-stat-note">'+(prepDelta>=0 ? 'Up '+prepDelta+' point'+(prepDelta===1?'':'s')+' from '+prep1.overall+'/100 on Day 1.' : 'Down '+Math.abs(prepDelta)+' point'+(Math.abs(prepDelta)===1?'':'s')+' from '+prep1.overall+'/100 on Day 1 — worth another cycle.')+'</div>'+
        radarLegendHtml([{label:'Day 1 (baseline)',cls:'hollow'},{label:'Day 14 (now)',cls:'filled'}])+
      '</div>'+
    '</div>'+
    '<div class="tablewrap radar-mini-table"><table>'+
      '<thead><tr><th>Front</th><th style="text-align:right;">Day 1</th><th style="text-align:right;">Day 14</th><th style="text-align:right;">Change</th></tr></thead>'+
      '<tbody>'+ prep1.items.map(function(it,i){
        var p2 = prep2.items[i].prep, d = p2-it.prep;
        return '<tr><td>'+it.label+'</td><td class="num">'+it.prep+'</td><td class="num">'+p2+'</td><td class="num '+(d>=0?'change-pos':'change-neg')+'">'+(d>=0?'+':'')+d+'</td></tr>';
      }).join('') +'</tbody>'+
    '</table></div>'+
    '<div class="tablewrap" style="margin-top:20px;"><table>'+
      '<thead><tr><th>Metric</th><th style="text-align:right;">Day 1 mock</th><th style="text-align:right;">Day 14 mock</th><th style="text-align:right;">Change</th></tr></thead>'+
      '<tbody>'+
        '<tr><td>Marks scored</td><td class="num">'+mock.marksScored+'</td><td class="num">'+followup.marksScored+'</td><td class="num '+(marksDelta>=0?'change-pos':'change-neg')+'">'+(marksDelta>=0?'+':'')+marksDelta+'</td></tr>'+
        '<tr><td>Accuracy</td><td class="num">'+acc1+'%</td><td class="num">'+acc2+'%</td><td class="num '+(accDelta>=0?'change-pos':'change-neg')+'">'+(accDelta>=0?'+':'')+accDelta+' pp</td></tr>'+
        rows.map(function(r){
          var d = r.loss1-r.loss2;
          return '<tr><td>'+r.label+' losses (approx.)</td><td class="num">'+r.loss1+'</td><td class="num">'+r.loss2+'</td><td class="num '+(d>=0?'change-pos':'change-neg')+'">'+(d>=0?d+' recovered':(Math.abs(d)+' worse')) +'</td></tr>';
        }).join('')+
      '</tbody></table></div>'+
    '<div class="diag-hero" style="margin-top:20px;"><p>'+takeaway+'</p></div>'+
    '<p class="helper">Marks figures are approximate, based on marks-per-question entered on each mock and are not a guarantee of rank or score.</p>'+
  '</div>';
}

/* ---------------- main render ---------------- */
function render(){
  var app = document.getElementById('app');
  var html='';
  switch(state.route){
    case 'create': html = viewCreate(); break;
    case 'analyze': html = viewAnalyze(); break;
    case 'diagnosis': html = viewDiagnosis(); break;
    case 'calendar': html = viewCalendar(); break;
    case 'compare': html = viewCompare(); break;
    case 'profile': html = viewProfile(); break;
    default: html = viewLanding();
  }
  app.innerHTML = html;
}

document.getElementById('app').addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;
  if(action==='__noop'){ App.closeTask(); return; }
  if(App[action]) App[action](t);
});
document.getElementById('app').addEventListener('change', function(e){
  var t = e.target.closest('[data-field]');
  if(t) App.fieldChange(t);
});
document.getElementById('app').addEventListener('input', function(e){
  var t = e.target.closest('[data-field]');
  if(t && (t.tagName==='INPUT' && (t.type==='text'||t.type==='number')) ) App.fieldChange(t);
});

/* ---------------- PWA install + offline support ---------------- */
var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  var btn = document.getElementById('pwaInstallBtn');
  if(btn) btn.hidden = false;
});
var pwaBtn = document.getElementById('pwaInstallBtn');
if(pwaBtn){
  pwaBtn.addEventListener('click', function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      pwaBtn.hidden = true;
    });
  });
}
window.addEventListener('appinstalled', function(){
  var btn = document.getElementById('pwaInstallBtn');
  if(btn) btn.hidden = true;
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline caching unavailable - app still works online */ });
  });
}

/* ---------------- keyboard shortcuts: question analysis grid ---------------- */
document.addEventListener('keydown', function(e){
  if(state.route!=='analyze') return;
  var tgt = e.target;
  var tag = (tgt.tagName||'').toLowerCase();
  if(tag==='textarea' || (tag==='input' && (tgt.type==='text'||tgt.type==='number')) || tag==='select') return;
  var card = tgt.closest && tgt.closest('.qcard');
  if(!card) return;
  if(e.key>='1' && e.key<='6'){
    var cat = CATEGORIES[Number(e.key)-1]; if(!cat) return;
    var radio = card.querySelector('input[type=radio][data-field$=".primary"][value="'+cat.id+'"]');
    if(!radio) return;
    e.preventDefault();
    radio.checked = true;
    radio.dispatchEvent(new Event('change', {bubbles:true}));
    radio.focus();
  } else if((e.key==='ArrowDown' || e.key==='ArrowUp') && e.altKey){
    e.preventDefault();
    var cards = Array.prototype.slice.call(document.querySelectorAll('.qcard'));
    var next = cards[cards.indexOf(card) + (e.key==='ArrowDown'?1:-1)];
    if(next){
      var focusTarget = next.querySelector('input[type=radio]:checked') || next.querySelector('input, select');
      if(focusTarget){ focusTarget.focus(); if(focusTarget.scrollIntoView) focusTarget.scrollIntoView({block:'center', behavior:'smooth'}); }
    }
  }
});

/* ---------------- entry routing (PWA shortcuts) ---------------- */
function handleEntryRoute(){
  try{
    var params = new URLSearchParams(location.search);
    var r = params.get('route');
    if(!r) return;
    if(r==='new'){
      state.route = 'create'; state.routeParams = {role:'initial'};
    } else if(r==='today'){
      var withPlan = realMocks().filter(function(m){ return findPlan(m.id); })
        .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      if(withPlan.length) { state.route = 'calendar'; state.routeParams = {mockId: withPlan[0].id}; }
    }
    history.replaceState(null, '', location.pathname);
  }catch(e){ /* URLSearchParams unsupported or blocked - fall through to normal landing */ }
}

/* hot-reload friendliness for republishes */
function boot(){
  handleEntryRoute();
  render();
  App.maybeNotifyToday();
}
if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
} else {
  boot();
}
})();
</script>
