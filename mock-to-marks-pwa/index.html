<style>
html{color-scheme:dark;}
body{margin:0;background:var(--pj-bg);color:var(--pj-ink);font-family:var(--pj-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
.blob{position:absolute;filter:blur(70px);opacity:.25;border-radius:50%;animation:drift 30s ease-in-out infinite alternate;}
.blob.g{width:42vmax;height:42vmax;top:-18%;left:-16%;background:radial-gradient(circle,#d9b46f,transparent 68%);}
.blob.n{width:36vmax;height:36vmax;top:-6%;right:-18%;background:radial-gradient(circle,#7fc6a4,transparent 68%);animation-delay:-9s;}
.blob.c{width:40vmax;height:40vmax;bottom:-22%;left:24%;background:radial-gradient(circle,#cf7e7b,transparent 68%);animation-delay:-17s;}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08);}}
@media (prefers-reduced-motion:reduce){.blob{animation:none;}}
main{max-width:1100px;margin:0 auto;padding:8px 16px 0;}
.hero{margin:18px 0 8px;}
.hero h1{font-family:var(--pj-serif);font-weight:600;font-size:clamp(30px,6vw,48px);line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;}
.hero h1 em{font-style:normal;color:var(--pj-gold);}
.hero p{color:var(--pj-ink-soft);max-width:620px;margin:0;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px;}
.tile{position:relative;display:block;text-decoration:none;color:inherit;background:var(--pj-glass);border:1px solid var(--pj-border);
  border-radius:24px;padding:22px;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  transition:transform .15s, border-color .15s;overflow:hidden;}
.tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--pj-gold) 45%,transparent);}
.tile .tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;}
.tile.arena .tag{background:color-mix(in srgb,var(--pj-green) 20%,transparent);color:var(--pj-green);}
.tile.m2m .tag{background:color-mix(in srgb,var(--pj-gold) 20%,transparent);color:var(--pj-gold);}
.tile h2{font-family:var(--pj-serif);font-weight:600;font-size:28px;margin:12px 0 6px;letter-spacing:-.01em;}
.tile p{color:var(--pj-ink-soft);margin:0 0 14px;}
.tile ul{margin:0 0 16px;padding:0;list-style:none;color:var(--pj-ink);font-size:14px;}
.tile li{padding:3px 0;}
.tile .go{font-weight:800;color:var(--pj-gold);}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;}
.statrow span{font-size:12.5px;font-weight:700;background:var(--pj-glass-2);border:1px solid var(--pj-border);border-radius:99px;padding:4px 10px;}
/* profile */
.prof{max-width:720px;margin:18px auto 0;}
.panel{background:var(--pj-glass);border:1px solid var(--pj-border);border-radius:22px;padding:20px;margin-top:14px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
.panel h3{font-family:var(--pj-serif);font-weight:600;font-size:20px;margin:0 0 10px;}
.who{display:flex;gap:16px;align-items:center;}
.who .pj-avatar{width:72px;height:72px;cursor:default;}
.who .pj-avatar svg{width:40px;height:40px;}
.who b{font-family:var(--pj-serif);font-size:24px;font-weight:600;display:block;}
.who span{color:var(--pj-ink-faint);font-size:14px;word-break:break-all;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
.kv div{background:var(--pj-glass-2);border:1px solid var(--pj-border);border-radius:14px;padding:12px;}
.kv b{display:block;font-size:20px;font-family:var(--pj-serif);}
.kv small{color:var(--pj-ink-faint);font-size:12px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--pj-border);}
.row:first-of-type{border-top:0;}
.row .t{flex:1;min-width:200px;}
.row .t b{display:block;font-size:14.5px;}
.row .t small{color:var(--pj-ink-faint);font-size:12.5px;}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;}
.pill.ok{background:color-mix(in srgb,var(--pj-green) 20%,transparent);color:var(--pj-green);}
.pill.warn{background:color-mix(in srgb,var(--pj-gold) 20%,transparent);color:var(--pj-gold);}
.back{color:var(--pj-ink-soft);text-decoration:none;font-weight:700;font-size:14px;}
.signed-out-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
/* hero + try-it + daily goal */
.hero .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.hero .cta-row .pj-btn{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;}
.hero .trust{color:var(--pj-ink-faint);font-size:13px;margin-top:10px;}
.tryit{margin-top:20px;padding:18px;border-radius:22px;background:var(--pj-glass);border:1px solid var(--pj-border);max-width:640px;}
.tryit h2{font-family:var(--pj-serif);font-weight:600;font-size:20px;margin:0 0 4px;}
.tryit .sub{color:var(--pj-ink-faint);font-size:13px;margin:0 0 12px;}
.ti-bar{height:6px;border-radius:99px;background:var(--pj-glass-2);overflow:hidden;margin:0 0 14px;}
.ti-bar i{display:block;height:100%;background:var(--pj-gold);border-radius:99px;transition:width .25s;}
.ti-q{font-size:16px;font-weight:600;margin:0 0 12px;}
.ti-opts{display:grid;gap:8px;}
.ti-opt{min-height:48px;text-align:left;padding:10px 14px;border-radius:14px;border:1px solid var(--pj-border);background:var(--pj-glass-2);color:var(--pj-ink);font:inherit;cursor:pointer;}
.ti-opt:hover:not([disabled]){border-color:var(--pj-gold);}
.ti-opt.right{border-color:var(--pj-green);background:color-mix(in srgb,var(--pj-green) 18%,transparent);}
.ti-opt.wrong{border-color:var(--pj-coral,#cf7e7b);background:color-mix(in srgb,#cf7e7b 18%,transparent);}
.ti-note{margin:12px 0 0;font-size:14px;color:var(--pj-ink-soft);}
.ti-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.ti-actions .pj-btn,.ti-actions a.pj-btn{min-height:48px;height:auto;padding:10px 18px;box-sizing:border-box;display:inline-flex;align-items:center;text-decoration:none;}
.goal{margin-top:20px;padding:18px;border-radius:22px;background:var(--pj-glass);border:1px solid var(--pj-border);max-width:640px;}
.goal b{font-family:var(--pj-serif);font-size:20px;font-weight:600;}
.goal p{margin:6px 0 12px;color:var(--pj-ink-soft);}
@media (prefers-reduced-motion:reduce){.ti-bar i{transition:none;}}

</style>
</head>

<!-- `defer` deliberately NOT used here: it has no effect on an inline
     script (only on external `src` scripts), and this file's own inline
     script below calls `PJ....` synchronously at top level. Deferring just
     the scripts above it while this stayed non-deferred made it run before
     pj-core.js had executed, throwing "PJ is not defined" - caught by an
     actual Playwright run against real network, not just a test stub. -->
<script>
(function(){
  var view = document.getElementById('view');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function arenaStats(){
    try{ var s = JSON.parse(localStorage.getItem('prodjee.arena.v1')||'null'); if(!s) return null;
      var gp=typeof s.totalGP==='number'?s.totalGP:Object.keys(s.totalGP||{}).reduce(function(sum,k){return sum+(Number(s.totalGP[k])||0);},0);
      return { gp:gp, streak:(s.streak&&s.streak.count)||0, correct:(s.counters&&s.counters.correct)||0, sessions:(s.counters&&s.counters.sessions)||0 };
    }catch(e){ return null; }
  }
  function m2mStats(){
    try{ var s = JSON.parse(localStorage.getItem('mtm_state_v1')||'null'); if(!s) return null;
      return { mocks:(s.mocks||[]).filter(function(m){return m.id!=='demo';}).length, plans:(s.plans||[]).length };
    }catch(e){ return null; }
  }
  var entitlement = null;
  function isSubActive(d){ return !!(d && d.entitled === true && (!d.entitledUntil || d.entitledUntil > Date.now())); }
  function loadEntitlement(){
    var u = PJ.user; if(!u) return;
    firebase.firestore().collection('users').doc(u.uid).get()
      .then(function(d){ entitlement = d.exists ? d.data() : {entitled:false}; route(); })
      .catch(function(){ entitlement = {entitled:false}; route(); });
  }
  function n(x){ return Math.round(x).toLocaleString('en-IN'); }
  function studentProfile(){ try{return JSON.parse(localStorage.getItem('prodjee.student.v1')||'null')||{};}catch(e){return {};} }

  /* ---- no-login taste of the product: 3 original sample questions ---- */
  var TRY_QS = [
    {s:'Physics', q:'Light of photon energy 5 eV falls on a metal with work function 2 eV. The stopping potential is:', o:['2 V','3 V','5 V','7 V'], a:1, e:'eV₀ = 5 eV − 2 eV = 3 eV, so V₀ = 3 V.'},
    {s:'Chemistry', q:'Which of the following molecules has zero dipole moment?', o:['NH₃','H₂O','BF₃','CHCl₃'], a:2, e:'BF₃ is trigonal planar and symmetric, so the three B–F bond dipoles cancel. The others are polar.'},
    {s:'Mathematics', q:'Two fair dice are thrown. The probability that the sum of the numbers is 7 is:', o:['1/6','5/36','1/12','7/36'], a:0, e:'6 of the 36 outcomes give a sum of 7, so the probability is 6/36 = 1/6.'}
  ];
  var tryState = {i:0, score:0, picked:null, started:false, done:false};
  function track(name, params){ try{ if(window.pjTrack) pjTrack(name, params); }catch(e){} }
  function tryItHtml(u){
    var t = tryState, total = TRY_QS.length;
    if(t.done){
      var msg = t.score===total ? 'Clean sweep. Now try a full round.' : t.score>0 ? 'Good start. Every miss shows what to fix next.' : 'Tough round. Arena will show you why, one question at a time.';
      var share = 'https://wa.me/?text='+encodeURIComponent('I scored '+t.score+'/'+total+' on ProDJEE’s quick JEE round. Beat me: https://prodjee.in/?utm_source=share&utm_medium=whatsapp&utm_campaign=tryit');
      return '<section class="tryit" id="tryit" aria-live="polite"><h2>You scored '+t.score+'/'+total+'</h2><p class="sub">'+msg+'</p>'+
        '<div class="ti-actions"><a class="pj-btn pj-btn-primary" href="/arena/" data-next="arena_after_tryit">Play a full Arena round →</a>'+
        '<a class="pj-btn pj-btn-ghost" href="/m2m/" data-next="scoregps_after_tryit">Analyse my last mock</a>'+
        '<a class="pj-btn pj-btn-ghost" href="'+share+'" target="_blank" rel="noopener" data-share="tryit_result">Challenge a friend</a>'+
        '<button class="pj-btn pj-btn-ghost" data-ti="again">Retry</button></div>'+
        (u ? '' : '<p class="sub" style="margin-top:12px">Sign in to save your streak and progress. <button class="pj-btn pj-btn-sm pj-btn-ghost" data-pj-act="sign-in">Continue with Google</button></p>')+'</section>';
    }
    var q = TRY_QS[t.i], answered = t.picked!==null;
    var opts = q.o.map(function(label,idx){
      var cls = 'ti-opt'; if(answered){ if(idx===q.a) cls+=' right'; else if(idx===t.picked) cls+=' wrong'; }
      return '<button class="'+cls+'" data-ti="opt" data-i="'+idx+'"'+(answered?' disabled':'')+'>'+esc(label)+'</button>';
    }).join('');
    return '<section class="tryit" id="tryit" aria-live="polite"><h2>Try 3 questions. No sign-in.</h2><p class="sub">'+q.s+' · Question '+(t.i+1)+' of '+total+'</p>'+
      '<div class="ti-bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+t.i+'"><i style="width:'+Math.round(100*t.i/total)+'%"></i></div>'+
      '<p class="ti-q">'+esc(q.q)+'</p><div class="ti-opts">'+opts+'</div>'+
      (answered ? '<p class="ti-note"><b>'+(t.picked===q.a?'Correct. ':'Not quite. ')+'</b>'+esc(q.e)+'</p><div class="ti-actions"><button class="pj-btn pj-btn-primary" data-ti="next">'+(t.i+1<total?'Next question →':'See my score')+'</button></div>' : '')+'</section>';
  }
  /* ---- daily goal + streak for returning players (local Arena data) ---- */
  var DAILY_GOAL = 5;
  function todayQuestions(){
    try{
      var s = JSON.parse(localStorage.getItem('prodjee.arena.v1')||'null'); if(!s || !s.sessions) return 0;
      var d = new Date(), k = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
      return s.sessions.reduce(function(sum,x){ var dt=new Date(x.at), kk=dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); return kk===k ? sum+(x.n||0) : sum; },0);
    }catch(e){ return 0; }
  }
  function goalBlock(u, a){
    if(!u || !a || !a.sessions) return '';
    var done = Math.min(todayQuestions(), DAILY_GOAL), left = DAILY_GOAL-done;
    var msg = left===0 ? 'Daily goal done. Your streak is safe for today.' : (a.streak>0 ? 'Play today to keep your '+a.streak+'-day streak going. '+left+' more question'+(left===1?'':'s')+' hits today’s goal.' : left+' more question'+(left===1?'':'s')+' hits today’s goal.');
    return '<section class="goal"><b>Today: '+done+'/'+DAILY_GOAL+' questions · 🔥 '+a.streak+'-day streak</b><p>'+msg+'</p>'+
      '<div class="ti-bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+DAILY_GOAL+'" aria-valuenow="'+done+'"><i style="width:'+Math.round(100*done/DAILY_GOAL)+'%"></i></div>'+
      '<a class="pj-btn pj-btn-primary" style="min-height:48px;display:inline-flex;align-items:center;text-decoration:none" href="/arena/" data-next="arena_daily_goal">'+(left===0?'Keep going in Arena →':'Continue in Arena →')+'</a></section>';
  }
  view.addEventListener('click', function(e){
    var el = e.target.closest('[data-ti],[data-hero-cta],[data-to],[data-next],[data-share]'); if(!el) return;
    if(el.dataset.heroCta){
      track('hero_cta_click', {cta: el.dataset.heroCta});
      if(el.dataset.heroCta==='try'){ var tryEl=document.getElementById('tryit'); if(tryEl){ e.preventDefault(); tryEl.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); } }
      return;
    }
    if(el.dataset.to){ track('cross_feature_click', {from_feature:'home', to_feature:el.dataset.to, placement:'home_tile'}); return; }
    if(el.dataset.next){ track('cross_feature_click', {from_feature:'home', to_feature:el.dataset.next.split('_')[0], placement:el.dataset.next}); return; }
    if(el.dataset.share){ track('share_click', {method:'whatsapp', content:el.dataset.share}); return; }
    var act = el.dataset.ti, t = tryState;
    if(act==='opt' && t.picked===null){
      if(!t.started){ t.started = true; track('tryit_started', {}); }
      t.picked = +el.dataset.i; if(t.picked===TRY_QS[t.i].a) t.score++;
    } else if(act==='next'){
      if(t.i+1<TRY_QS.length){ t.i++; t.picked=null; } else { t.done = true; track('tryit_completed', {score:t.score, total:TRY_QS.length}); }
    } else if(act==='again'){ tryState = {i:0, score:0, picked:null, started:false, done:false}; }
    else return;
    var host = document.getElementById('tryit'); if(host){ host.outerHTML = tryItHtml(PJ.user); var nh = document.getElementById('tryit'); var focusEl = nh && nh.querySelector('.ti-opt:not([disabled]),[data-ti],a.pj-btn'); if(focusEl) focusEl.focus({preventScroll:true}); }
  });

  function renderHome(){
    var u = PJ.user, a = arenaStats(), m = m2mStats();
    var gl = goalBlock(u, a);
    view.innerHTML =
      '<section class="hero">'+
        '<h1>Lost marks in your last mock? <em>See exactly where they went.</em></h1>'+
        '<p>Free JEE &amp; NEET practice, plus a mock analysis that shows which mistakes are costing you rank.</p>'+
        '<div class="cta-row"><a class="pj-btn pj-btn-primary" href="#tryit" data-hero-cta="try">Try 3 questions now</a>'+
        '<a class="pj-btn pj-btn-ghost" href="/m2m/" data-hero-cta="analyse">Analyse my last mock</a></div>'+
        '<div class="trust">No sign-in needed to try. Free to start.</div>'+
      '</section>'+
      (gl || tryItHtml(u))+
      '<div class="cards">'+
        '<a class="tile arena" href="/arena/" data-to="arena"><span class="tag">Free</span><h2>Arena</h2>'+
          '<p>Practise like the exam: JEE Main and NEET PYQs plus practice sets, with timers, hints and full solutions. Every miss goes to your Mistake Vault so you fix it before the exam does.</p>'+
          (u && a ? '<div class="statrow"><span>'+n(a.gp)+' GP</span><span>🔥 '+a.streak+'-day streak</span><span>'+n(a.correct)+' correct</span></div>' : '')+
          '<ul>'+(u && a ? '' : '<li>🎯 Drill one chapter at a time</li><li>⚡ Hints and step-by-step solutions</li><li>📈 See your weak chapters turn green</li>')+'<li>📚 <!--BANK_COUNT-->6,975<!--/BANK_COUNT--> questions and growing</li><li>🔄 New questions added every 2 hours</li></ul>'+
          '<span class="go">Play Arena →</span></a>'+
        '<a class="tile m2m" href="/m2m/" data-to="scoregps"><span class="tag">Gaps · Plan · Score</span><h2>ScoreGPS</h2>'+
          '<p>See which chapters and which kinds of mistakes are costing you the most rank. Log your last mock, find the exact cause behind each lost mark, then follow a 7- or 14-day plan to win them back.</p>'+
          (u && m && m.mocks ? '<div class="statrow"><span>'+m.mocks+' mock'+(m.mocks>1?'s':'')+' logged</span><span>'+m.plans+' plan'+(m.plans===1?'':'s')+'</span></div>' : '<ul><li>🔍 Know why each mark was lost</li><li>🧭 Fix the biggest leak first</li><li>🗓️ A 14-day plan built on your gaps</li></ul>')+
          '<span class="go">Open ScoreGPS →</span></a>'+
        '<a class="tile arena" href="/coach/" data-to="coach"><span class="tag">New · Personalised</span><h2>My Coach</h2><p>Know what to study today. Get a weak-chapter mission every day, spaced revision, custom tests and official exam updates, set up once for JEE or NEET.</p><ul><li>🧭 One-time JEE/NEET setup</li><li>🗞 Official exam updates</li><li>✅ Daily roadmap and revision</li></ul><span class="go">Open My Coach →</span></a>'+
      '</div>';
  }

  function renderProfile(){
    var u = PJ.user;
    if(!u){ renderHome(); return; }
    if(entitlement===null) loadEntitlement();
    var a = arenaStats() || {gp:0,streak:0,correct:0,sessions:0}, m = m2mStats() || {mocks:0,plans:0}, sp=studentProfile();
    var ds = PJ.driveStatus(), last = PJ.lastSync;
    var driveRow = ds==='on'
      ? '<div class="row"><div class="t"><b>Google Drive backup <span class="pill ok">On</span></b><small>'+(last?'Last synced '+new Date(last).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'Not synced yet')+'. Stored in a private app folder only ProDJEE can see.</small></div><button class="pj-btn pj-btn-ghost pj-btn-sm" id="syncNow">Sync now</button></div>'
      : '<div class="row"><div class="t"><b>Google Drive backup <span class="pill warn">Off</span></b><small>Your data is only on this device. If you clear the browser or change phones, it’s gone.</small></div><button class="pj-btn pj-btn-primary pj-btn-sm" data-pj-act="enable-drive">Enable backup</button></div>';
    var subActive = isSubActive(entitlement);
    var subValue = entitlement===null ? '…' : (subActive ? 'Subscribed' : 'Free');
    var subSub = subActive && entitlement.entitledUntil ? 'Valid till '+new Date(entitlement.entitledUntil).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : 'Plan status';
    view.innerHTML =
      '<div class="prof">'+
        '<a class="back" href="/">← Home</a>'+
        '<div class="panel"><div class="who">'+
          '<span class="pj-avatar" data-pj-avatar></span>'+
          '<div style="flex:1;min-width:0;" id="nameBlock">'+
            '<div id="nameReadout" style="display:flex;align-items:center;gap:8px;"><b>'+esc(PJ.getName()||'ProDJEE student')+'</b>'+
              '<button class="pj-btn pj-btn-ghost pj-btn-sm" id="editNameBtn" title="Change your display name" style="padding:2px 8px;">Edit</button></div>'+
            '<span>'+esc(u.email||'')+'</span>'+
          '</div>'+
        '</div><div class="row" style="margin-top:14px"><div class="t"><b>Preparing for</b><small>Personalises Coach, News, subjects and chapters.</small></div><select id="profileExam" style="width:auto;min-width:110px;padding:8px;border-radius:9px;background:var(--pj-panel);color:var(--pj-ink);border:1px solid var(--pj-border)"><option value="JEE"'+((sp.exam||'JEE')==='JEE'?' selected':'')+'>JEE</option><option value="NEET"'+(sp.exam==='NEET'?' selected':'')+'>NEET</option></select></div></div>'+
        '<div class="panel"><h3>Arena</h3><div class="kv">'+
          '<div><b>'+n(a.gp)+'</b><small>Gyan Points</small></div><div><b>🔥 '+a.streak+'</b><small>Day streak</small></div>'+
          '<div><b>'+n(a.correct)+'</b><small>Correct answers</small></div><div><b>'+n(a.sessions)+'</b><small>Sessions</small></div></div></div>'+
        '<div class="panel"><h3>ScoreGPS</h3><div class="kv">'+
          '<div><b>'+m.mocks+'</b><small>Mocks logged</small></div><div><b>'+m.plans+'</b><small>Plans</small></div>'+
          '<div><b>'+subValue+'</b><small>'+subSub+'</small></div></div></div>'+
        '<div class="panel"><h3>Your data</h3>'+ driveRow +
          '<div class="row"><div class="t"><b>Download my data</b><small>A JSON file with everything ProDJEE stores for you on this device.</small></div><button class="pj-btn pj-btn-ghost pj-btn-sm" id="exportData">Download</button></div>'+
          '<div class="row"><div class="t"><b>Delete my data</b><small>Erases your study data from this device and your Google Drive backup, then signs you out. Payment records are kept as required by law; to close your account email prodjeelabs@gmail.com.</small></div><button class="pj-btn pj-btn-danger pj-btn-sm" id="deleteData">Delete</button></div>'+
          '<div class="row"><div class="t"><b>Sign out</b><small>Your data stays on this device and in Drive.</small></div><button class="pj-btn pj-btn-ghost pj-btn-sm" id="signOut">Sign out</button></div>'+
        '</div>'+
        '<p style="color:var(--pj-ink-faint);font-size:12.5px;margin-top:14px">Read our <a href="/privacy.html" style="color:var(--pj-gold)">Privacy Policy</a>, <a href="/terms.html" style="color:var(--pj-gold)">Terms</a> and <a href="/disclaimer.html" style="color:var(--pj-gold)">Disclaimer</a>. Manage Google access at <a href="https://myaccount.google.com/permissions" target="_blank" rel="noopener" style="color:var(--pj-gold)">myaccount.google.com/permissions</a>. Questions? <a href="mailto:prodjeelabs@gmail.com" style="color:var(--pj-gold)">Contact us</a>.</p>'+
        '<p style="color:var(--pj-ink-faint);font-size:11.5px;margin-top:8px">© 2026 ProDJEE. Not affiliated with the National Testing Agency (NTA). JEE and NEET are conducted by NTA.</p>'+
      '</div>';
    PJ.paint();
    var editBtn = document.getElementById('editNameBtn');
    if(editBtn) editBtn.onclick = function(){
      var block = document.getElementById('nameReadout');
      block.innerHTML = '<input id="nameInput" value="'+esc(PJ.getName())+'" maxlength="40" style="font-size:15px;padding:6px 9px;border:1px solid var(--pj-border,#444);border-radius:8px;background:transparent;color:inherit;width:180px;">'+
        '<button class="pj-btn pj-btn-primary pj-btn-sm" id="saveNameBtn">Save</button>';
      var inp = document.getElementById('nameInput'); inp.focus(); inp.select();
      var save = function(){ PJ.setName(inp.value); renderProfile(); };
      document.getElementById('saveNameBtn').onclick = save;
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') save(); });
    };
    document.getElementById('profileExam').onchange=function(){
      var exam=this.value==='NEET'?'NEET':'JEE';sp.exam=exam;sp.year=sp.year||2027;localStorage.setItem('prodjee.student.v1',JSON.stringify(sp));
      try{var ar=JSON.parse(localStorage.getItem('prodjee.arena.v1')||'{}');ar.exam=exam;localStorage.setItem('prodjee.arena.v1',JSON.stringify(ar));}catch(e){}
      PJ.toast('Exam changed to '+exam+' ✅');
    };
    var sn = document.getElementById('syncNow');
    if(sn) sn.onclick = function(){ sn.disabled = true; sn.textContent = 'Syncing…'; PJ.syncNow().then(function(ok){ PJ.toast(ok?'Synced with Google Drive ✅':'Sync didn’t finish. Try again.'); renderProfile(); }); };
    document.getElementById('exportData').onclick = PJ.exportData;
    document.getElementById('signOut').onclick = function(){ PJ.signOut().then(function(){ location.hash=''; }); };
    document.getElementById('deleteData').onclick = function(){
      if(!confirm('Delete all your ProDJEE study data from this device and from your Google Drive backup? This cannot be undone.')) return;
      PJ.deleteAll().then(function(driveOk){ alert(driveOk ? 'Your data has been deleted.' : 'Deleted from this device. We couldn’t reach Google Drive — you can remove the backup at Drive → Settings → Manage apps → ProDJEE → Delete hidden app data.'); location.href='/'; });
    };
  }

  // No forced sign-in wall here - the hub is free to browse. Signing in is
  // only ever asked for at an actual gated action: the top-bar avatar
  // (pj-core's own click handler already gates that) or the hero's
  // "Continue with Google" button.
  function route(){ if(location.hash==='#profile') renderProfile(); else renderHome(); }
  window.addEventListener('hashchange', route);
  PJ.onRemoteData(function(){ route(); });
  PJ.onChange(function(){ route(); });
  route();
})();
</script>
</body>
</html>
