<style>
/* ProDJEE brand system v4: deep-space navy glass, using the same saturated
   tones as Arena's own UI (gold #ffc23d, crimson #f04848, mint #4ff0a0)
   rather than paler tints of them, so Mock-to-Marks and Arena read as one
   product. No other hue is used besides these three and the raw logo hues
   reserved for the background blobs.
   Fraunces display + Manrope body + JetBrains Mono for data.
   Committed single dark identity — not a light/dark pair. */
:root{
  --bg:#0a0b14;
  --bg-2:#0d0e1c;
  --surface:color-mix(in srgb, #1c1f36 46%, transparent);
  --surface-2:color-mix(in srgb, #24273f 46%, transparent);
  --border:color-mix(in srgb, #fff 13%, transparent);
  --border-soft:color-mix(in srgb, #fff 7%, transparent);
  --ink:#f2eff9;
  --ink-soft:#b6b1cf;
  --ink-faint:#8a86a6;
  --neutral-soft:color-mix(in srgb, var(--ink-faint) 20%, transparent);
  --primary:#ffc23d;
  --primary-strong:#ffe07a;
  --primary-soft:color-mix(in srgb, var(--primary) 18%, transparent);
  --on-primary:#2b1c05;
  --good:#4ff0a0;
  --good-soft:color-mix(in srgb, var(--good) 18%, transparent);
  --warn:#ffc23d;
  --warn-soft:color-mix(in srgb, var(--warn) 18%, transparent);
  --danger:#f04848;
  --danger-soft:color-mix(in srgb, var(--danger) 18%, transparent);
  --shadow-color:250 60% 3%;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', SFMono-Regular, Menlo, monospace;
  --glass-bg:color-mix(in srgb, #1c1f36 40%, transparent);
  --glass-bg-2:color-mix(in srgb, #24273f 40%, transparent);
  --glass-border:color-mix(in srgb, #fff 15%, transparent);
  --glass-blur:blur(28px) saturate(180%);
  --glow-primary:0 10px 36px -10px color-mix(in srgb, var(--primary) 55%, transparent);
  --glow-good:0 10px 30px -10px color-mix(in srgb, var(--good) 55%, transparent);
  --glow-danger:0 10px 30px -10px color-mix(in srgb, var(--danger) 55%, transparent);
  --scrim-blur-light:blur(6px);
  --scrim-blur-strong:blur(14px) saturate(140%);
  /* Raw logo hues, reserved for the background blobs only - every other
     accent in this file stays a pastel tint of these (see comment above). */
  --logo-coral:#ff4040;
  --logo-gold:#ffb500;
  --logo-green:#00ff80;
}
@media (max-width:640px){
  :root{
    --glass-blur:blur(11px) saturate(140%);
    --scrim-blur-light:blur(3px);
    --scrim-blur-strong:blur(7px) saturate(120%);
  }
}
*{box-sizing:border-box;}
html{color-scheme:dark;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.blob{position:absolute;filter:blur(60px);opacity:.55;mix-blend-mode:screen;animation:blobMorph ease-in-out infinite alternate;}
.blob-gold{width:42vmax;height:42vmax;top:-20%;left:-16%;background:radial-gradient(circle at 50% 50%, var(--logo-gold), transparent 68%);animation-duration:26s;}
.blob-green{width:38vmax;height:38vmax;top:-8%;right:-16%;background:radial-gradient(circle at 50% 50%, var(--logo-green), transparent 68%);animation-duration:31s;animation-delay:-9s;}
.blob-coral{width:40vmax;height:40vmax;bottom:-20%;left:22%;background:radial-gradient(circle at 50% 50%, var(--logo-coral), transparent 68%);animation-duration:28s;animation-delay:-17s;}
@keyframes blobMorph{
  0%{border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;transform:translate(0,0) scale(1);}
  50%{border-radius:58% 42% 38% 62% / 55% 65% 35% 45%;transform:translate(4%,-3%) scale(1.08);}
  100%{border-radius:38% 62% 55% 45% / 40% 50% 50% 60%;transform:translate(-3%,4%) scale(.96);}
}
@media (prefers-reduced-motion:reduce){.blob{animation:none;border-radius:50%;}}
@media (max-width:640px){.blob{filter:blur(36px);opacity:.4;}}
#app{position:relative;z-index:1;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;color:var(--ink);margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--primary);}
::selection{background:var(--primary);color:var(--on-primary);}
::placeholder{color:var(--ink-faint);opacity:1;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
*{scrollbar-color:var(--border) var(--bg);scrollbar-width:thin;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.shell{max-width:900px;margin:0 auto;padding:0 20px;}
.shell-wide{max-width:1120px;margin:0 auto;padding:0 20px;}

/* Desktop-only left nav, same pattern as Arena's own sidenav: hidden below
   900px (mobile keeps the topbar's own buttons), a fixed column beside the
   scrollable content above that. */
.sidenav{display:none;}
@media (min-width:900px){
  .page-shell{display:grid;grid-template-columns:220px 1fr;align-items:start;}
  .sidenav{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 14px;
    background:var(--glass-bg-2);border-right:1px solid var(--border);
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);}
  .side-brand{padding:4px 8px 20px;}
  .side-brand img{width:36px;height:36px;border-radius:10px;display:block;}
  .side-link{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
    background:none;border:none;cursor:pointer;text-align:left;
    font-family:var(--sans);font-weight:700;font-size:14px;color:var(--ink-soft);}
  .side-link:hover{background:var(--surface-2);color:var(--ink);}
  /* These same three actions live in the sidenav now, so the topbar drops
     them at this width instead of showing both. Doubled selector beats the
     plain .topnav-primary-actions{display:contents} rule further down the
     sheet regardless of source order (equal specificity would otherwise
     let whichever rule comes later win, even inside this media query). */
  .topnav .topnav-primary-actions{display:none;}
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{max-width:1120px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.topbar-progress{height:3px;background:var(--border-soft);}
.topbar-progress-fill{height:100%;background:var(--primary);transition:width .2s;}
.wordmark{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:none;padding:0;}
.wordmark:hover .wordmark-logo{transform:scale(1.08) rotate(-4deg);}
.wordmark-logo{width:38px;height:38px;border-radius:9px;display:block;flex:none;transition:transform .2s;animation:logoRing 3.2s ease-out infinite;}
@keyframes logoRing{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent);}70%,100%{box-shadow:0 0 0 9px transparent;}}
.wordmark-text{font-family:var(--serif);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-0.01em;}
.topnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.topnav-primary-actions{display:contents;}
.topnav-mockname{font-size:13px;color:var(--ink-soft);padding:0 10px;border-right:1px solid var(--border);margin-right:2px;}
.avatar-btn{width:34px;height:34px;border-radius:99px;background:var(--primary);color:var(--on-primary);border:none;font-family:var(--sans);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:2px;overflow:hidden;transition:background .15s, transform .1s;}
.avatar-btn:hover{background:var(--primary-strong);transform:scale(1.1);}
.avatar-btn:active{transform:translateY(1px);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;border:1px solid transparent;
  font-size:14px;font-weight:600;line-height:1;white-space:nowrap;
  transition:background .18s, border-color .18s, color .18s, transform .12s, box-shadow .22s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--glow-primary);}
.btn-primary:hover{background:var(--primary-strong);transform:translateY(-1px);box-shadow:0 14px 40px -8px color-mix(in srgb, var(--primary) 62%, transparent);}
.btn-ghost{background:color-mix(in srgb, var(--surface-2) 55%, transparent);color:var(--ink);border-color:var(--border);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);}
.btn-ghost:hover{background:color-mix(in srgb, var(--surface-2) 85%, transparent);border-color:var(--primary);}
.btn-apple{background:#000;color:#fff;border-color:#000;}
.btn-apple:hover{background:#1a1a1a;transform:translateY(-1px);}
.btn-text{background:none;border:none;color:var(--primary);font-weight:600;font-size:14px;padding:6px 4px;}
.btn-text:hover{color:var(--primary-strong);transform:translateX(3px);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- Landing ---------- */
.hero{padding:64px 0 40px;}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.12;max-width:14ch;}
.accent-text{color:var(--primary);text-shadow:0 0 28px color-mix(in srgb, var(--primary) 55%, transparent);}
.hero-sub{margin-top:18px;font-size:17px;color:var(--ink-soft);max-width:52ch;line-height:1.6;}
.hero-cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.loop{
  margin-top:52px;display:flex;align-items:center;gap:0;flex-wrap:wrap;
  border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;
}
.loop-step{flex:1 1 140px;padding:20px 18px;position:relative;}
.loop-step + .loop-step{border-left:1px solid var(--border-soft);}
.loop-label{font-family:var(--serif);font-weight:600;font-size:16px;}
.loop-desc{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

/* ---------- Icon tiles ---------- */
.icon-tile{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
  background:color-mix(in srgb, var(--tile-color, var(--primary)) 20%, transparent);color:var(--tile-color, var(--primary));
  box-shadow:0 6px 16px -8px color-mix(in srgb, var(--tile-color, var(--primary)) 55%, transparent);
  animation:iconFloat 3s ease-in-out infinite;}
.icon-tile.good{--tile-color:var(--good);}
.causes-grid>*:nth-child(2n) .icon-tile,.catlist>*:nth-child(2n) .icon-tile,.loop-step:nth-child(2n) .icon-tile{animation-delay:.3s;}
.causes-grid>*:nth-child(3n) .icon-tile,.catlist>*:nth-child(3n) .icon-tile,.loop-step:nth-child(3n) .icon-tile{animation-delay:.6s;}
@keyframes iconFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.loop-step .icon-tile{margin-bottom:10px;}
.cause-card .icon-tile{margin-bottom:12px;}
.catrow .icon-tile{margin-top:2px;}

.section{padding:56px 0;border-top:1px solid var(--border-soft);}
.section h2{font-size:24px;}
.section-lead{color:var(--ink-soft);margin-top:8px;max-width:56ch;font-size:14.5px;}
.fixlist{list-style:none;margin:20px 0 0;padding:0;max-width:640px;}
.fixlist li{padding:12px 0;border-top:1px solid var(--border-soft);font-size:14.5px;color:var(--ink-soft);line-height:1.6;}
.fixlist li:first-child{border-top:none;}
.fixlist b{color:var(--ink);font-family:var(--serif);font-weight:700;}
.causes-grid{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.cause-card{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;}
.cause-title{font-family:var(--serif);font-weight:600;font-size:15.5px;}
.cause-desc{font-size:13px;color:var(--ink-soft);margin-top:5px;}
.sd-wrap{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.sd-card{border:1px solid var(--border);border-radius:14px;padding:18px;}
.sd-card h3{font-size:16px;}
.sd-card ol{margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
.footnote{padding:28px 0 60px;font-size:12.5px;color:var(--ink-faint);border-top:1px solid var(--border-soft);}

/* ---------- Cards / surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;transition:border-color .2s, box-shadow .2s;}
.card + .card{margin-top:14px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 24%, transparent);}
.field-hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;}
.form-title{font-size:21px;margin-bottom:4px;}
.form-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:24px;}

/* ---------- Chips (radios) ---------- */
.chiprow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{position:relative;}
.chip input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.chip span{
  display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--border);font-size:12.5px;color:var(--ink-soft);background:var(--surface);
  transition:background .15s, border-color .15s, color .15s, transform .12s, box-shadow .15s;
}
.chip span:hover{border-color:var(--ink-faint);transform:translateY(-1px);}
.chip input:checked + span{background:color-mix(in srgb, var(--primary) 88%, var(--surface));border-color:var(--primary);color:var(--on-primary);font-weight:600;box-shadow:0 6px 18px -8px color-mix(in srgb, var(--primary) 60%, transparent);}
.chip input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px;}
.chip .num{font-family:var(--mono);opacity:.8;font-size:11px;}

/* ---------- Question analysis ---------- */
.analyze-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px;}
.analyze-head-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.analyze-ring{line-height:0;}
.switch-row{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
.switch-label{font-size:13px;color:var(--ink-soft);font-weight:600;}
.switch{display:inline-block;}
.switch input{position:absolute;opacity:0;width:1px;height:1px;}
.switch-track{display:block;width:40px;height:23px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);position:relative;transition:background .2s, border-color .2s, box-shadow .2s;}
.switch-thumb{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:99px;background:var(--ink-faint);transition:transform .2s cubic-bezier(.16,1,.3,1), background .2s;}
.switch input:checked + .switch-track{background:color-mix(in srgb, var(--primary) 55%, var(--surface-2));border-color:var(--primary);box-shadow:var(--glow-primary);}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(17px);background:var(--primary-strong);}
.switch input:focus-visible + .switch-track{outline:2px solid var(--primary);outline-offset:2px;}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.qcard{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px;}
.qcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.qnum{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink);}
.qcard select{border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface);font-size:12.5px;}
.qcard .subrow{display:flex;gap:8px;margin-bottom:10px;}
.qcard .subrow input[type=text]{flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
.qcard .subrow input[type=number]{width:64px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
.qcard-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin:10px 0 6px;}
.qcard-label:first-of-type{margin-top:0;}
.reasons{display:block;}
.qcard:has(input[value="correct"]:checked) .reasons{display:none;}
.qcard{transition:border-color .2s, background .2s, box-shadow .2s;}
.qcard.result-correct{border-color:color-mix(in srgb, var(--good) 60%, var(--border));background:color-mix(in srgb, var(--good-soft) 45%, var(--surface));box-shadow:var(--glow-good);}
.qcard.result-wrong{border-color:color-mix(in srgb, var(--danger) 60%, var(--border));background:color-mix(in srgb, var(--danger-soft) 45%, var(--surface));box-shadow:var(--glow-danger);}
.qcard.result-left{border-color:color-mix(in srgb, var(--ink-faint) 55%, var(--border));background:color-mix(in srgb, var(--neutral-soft) 45%, var(--surface));}

/* ---------- Diagnosis ---------- */
.diag-hero{border:1px solid var(--primary-soft);background:var(--primary-soft);border-radius:12px;padding:20px 22px;margin-bottom:22px;}
.diag-hero p{color:var(--ink);font-size:14.5px;line-height:1.6;}
.diag-hero b{font-family:var(--serif);}
.catlist{display:flex;flex-direction:column;gap:12px;}
.catrow{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;gap:18px;align-items:flex-start;}
.catrank{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink-faint);width:28px;flex:none;}
.catrow-body{flex:1;min-width:0;}
.catrow-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.cattitle{font-family:var(--serif);font-weight:600;font-size:17px;}
.priority-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:99px;}
.priority-high{background:var(--danger-soft);color:var(--danger);}
.priority-medium{background:var(--warn-soft);color:var(--warn);}
.priority-low{background:var(--good-soft);color:var(--good);}
.catdesc{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

<script>(function(){
  var splash = document.getElementById("splashOverlay");
  if(!splash) return;
  var seen = false;
  try{ seen = localStorage.getItem("mtm_splashSeen") === "1"; }catch(e){}
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(seen || reduced){ splash.remove(); return; }
  try{ localStorage.setItem("mtm_splashSeen", "1"); }catch(e){}
  var dismissed = false;
  var dismiss = function(){ if(dismissed) return; dismissed = true; splash.classList.add("splash-out"); setTimeout(function(){ splash.remove(); }, 260); };
  var video = document.getElementById("splashVideo");
  if(video){
    var start = function(){
      var rate = (video.duration && isFinite(video.duration) && video.duration > 0) ? (video.duration / 5) : 1;
      video.playbackRate = Math.min(Math.max(rate, 1), 16);
      var playPromise = video.play();
      if(playPromise && playPromise.catch){
        playPromise.catch(function(){
          video.muted = true;
          var retry = video.play();
          if(retry && retry.catch) retry.catch(dismiss);
        });
      }
    };
    if(video.readyState >= 1) start();
    else video.addEventListener("loadedmetadata", start, { once: true });
  }
  splash.addEventListener("click", dismiss);
  setTimeout(dismiss, 5000);
})();</script>

/* ---------------- scoring / allocation ---------------- */
function computeScores(questions){
  var scores={}, affected={};
  CATEGORIES.forEach(function(c){ scores[c.id]=0; affected[c.id]=new Set(); });
  questions.forEach(function(q, idx){
    if(!q.result || q.result==='correct') return;
    var w = WEIGHTS[q.result]; if(!w) return;
    if(q.primary && scores.hasOwnProperty(q.primary)){ scores[q.primary]+=w.primary; affected[q.primary].add(idx); }
    if(q.secondary && scores.hasOwnProperty(q.secondary)){ scores[q.secondary]+=w.secondary; affected[q.secondary].add(idx); }
  });
  return CATEGORIES.map(function(c){
    return {id:c.id, label:c.label, product:c.product, desc:c.desc, icon:c.icon,
      score: Math.round(scores[c.id]*100)/100, affectedCount: affected[c.id].size};
  });
}


function computePreparedness(mock){
  var scores = computeScores(mock.questions);
  var n = mock.numQuestions || NUM_Q;
  var items = CATEGORIES.map(function(c){
    var s = scores.find(function(x){ return x.id===c.id; });
    var raw = 100 - (s.score / n * 100);
    var prep = Math.round(Math.max(0, Math.min(100, raw)));
    return {id:c.id, label:c.label, prep:prep};
  });
  // Averaging the six per-axis scores overstates readiness: a student's losses
  // spread across categories so each axis only sees its own slice of the damage,
  // and averaging several diluted numbers compounds that. The headline number
  // instead reflects TOTAL weighted loss against total questions, matched
  // against actual accuracy so a low-scoring mock can't read as "prepared".
  var totalLoss = scores.reduce(function(s,c){ return s+c.score; }, 0);
  var lossBased = 100 - (totalLoss / n * 100);
  var attempted = mock.questions.filter(function(q){ return q.result && q.result!=='left'; }).length;
  var correct = mock.questions.filter(function(q){ return q.result==='correct'||q.result==='slow'||q.result==='guessed'; }).length;
  var accuracyBased = attempted ? (correct/attempted*100) : 100;
  var overall = Math.round(Math.max(0, Math.min(100, Math.min(lossBased, accuracyBased))));
  return {items:items, overall:overall};
}

function hexPt(cx,cy,R,axisIndex,value){
  var angle = (-90 + axisIndex*60) * Math.PI/180;

  return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
}

}

function requestPlanBlocks(payload){
  if(!authUser) return Promise.reject(new Error('Sign in first.'));
  return authUser.getIdToken().then(function(idToken){
    return fetch(API_BASE+'/generate-plan', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},
      body: JSON.stringify(payload)

  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(res){
      if(r.status===402){ entitlement = {entitled:false}; throw {notEntitled:true}; }
      if(!r.ok || !res.ok || !Array.isArray(res.blocks)) throw new Error(res.error || 'Could not build your plan. Check your connection and try again.');
      return res.blocks;
    });
  }, function(){ throw new Error('You look offline. Connect to the internet to build your plan.'); });
}

/* ---------------- access gate ----------------
   Two independent gates: sign-in (Google, via Firebase Auth) gates every
   route except landing; payment gates plan generation specifically. Free
   tier = sign in, analyse unlimited mocks, see your diagnosis. Paid tier
   (one-time ₹499, lifetime) = the 14-day plan itself.
   Firestore rules deny client writes to /users/{uid} entirely - "entitled"
   can only be set by verify-payment.js after checking Razorpay's signature
   server-side, so this can't be spoofed from devtools the way a shared

function fetchEntitlement(){
  if(!authUser) return Promise.resolve(null);
  return db.collection('users').doc(authUser.uid).get().then(function(doc){
    entitlement = doc.exists ? doc.data() : {entitled:false};
    return entitlement;
  }).catch(function(){ entitlement = {entitled:false}; return entitlement; });
}
function trackSource(){
  if(!authUser) return;
  var src;
  try{ src = localStorage.getItem('mtm_src'); }catch(e){ src = null; }
  if(!src) return;
  try{ if(sessionStorage.getItem('mtm_src_sent_'+authUser.uid)) return; }catch(e){}
  authUser.getIdToken().then(function(idToken){
    return fetch(API_BASE+'/track-source', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},
      body: JSON.stringify({source: src})
    });
  }).then(function(){
    try{ sessionStorage.setItem('mtm_src_sent_'+authUser.uid, '1'); }catch(e){}
  }).catch(function(){});
}
auth.onAuthStateChanged(function(user){
  authUser = user;
  if(!user){ entitlement = null; return; }
  trackSource();
  fetchEntitlement().then(function(){
    if(gatePending){ var resume = gatePending; gatePending = null; App.closeGate(); resume(); }
  });
});

function nav(route, params){
  if(route!=='landing' && !state.demo && !authUser){ showSignInGate(function(){ nav(route, params); }); return; }
  state.route=route; state.routeParams=params||{}; persist();
  var apply = function(){ render(); window.scrollTo(0,0); };
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(document.startViewTransition && !reduced){
    // ponytail: catches cover real clicks; two nav() calls fired in the same
    // synchronous tick (no realistic click does this) can still log a
    // benign "transition skipped" rejection.
    var vt = document.startViewTransition(apply);
    var noop = function(){};
    vt.ready.catch(noop); vt.updateCallbackDone.catch(noop); vt.finished.catch(noop);
  } else apply();
}

  fieldChange: function(target){
    var path = target.dataset.field; if(!path) return;
    var parts = path.split('.');
    if(parts[0]==='q'){
      var qi = Number(parts[1]), field = parts[2];
      var mockId = state.routeParams.mockId;
      var mock = findMock(mockId); if(!mock) return;
      var q = mock.questions[qi];
      var val = target.value;
      if(field==='time') val = val===''? null : Number(val);
      if((field==='primary'||field==='secondary') && val==='') val=null;
      if(field==='primary' && q.secondary===val) q.secondary=null;
      q[field]=val;
      if(field==='result' && val==='correct'){
        q.primary=null; q.secondary=null;
        var card = document.getElementById('qcard-'+qi);
        if(card){ card.querySelectorAll('.reasons input[type=radio]').forEach(function(r){ r.checked = (r.value===''); }); }
      }
      persist();
      App.refreshProgress();
      if(field==='result'){ App.refreshCardDone(qi); }
    }
    if(parts[0]==='cp'){
      var idx=Number(parts[1]), f=parts[2];
      var cp = state.routeParams._cpDraft;
      if(!cp) return;
      var val2 = target.value;
      if(f==='primary' && val2==='') val2=null;
      cp[idx][f]=val2;
      if(f==='result' && val2!=='wrong' && val2!=='left'){ cp[idx].primary=null; }
      render();
    }
  },
  refreshProgress: function(){
    var mock = findMock(state.routeParams.mockId); if(!mock) return;
    var total = mock.numQuestions || NUM_Q;
    var done = mock.questions.filter(function(q){return q.result;}).length;
    var badge = document.getElementById('progressBadge');
    if(badge) badge.textContent = done+' of '+total+' completed';
    var ringWrap = document.getElementById('analyzeRingWrap');
    if(ringWrap) ringWrap.innerHTML = buildProgressRing(total ? Math.round(done/total*100) : 0, 56);
    var stickyFill = document.getElementById('topbarProgressFill');
    if(stickyFill) stickyFill.style.width = (done/total*100)+'%';
    var btn = document.getElementById('genPlanBtn');
    if(btn) btn.disabled = done < total;
  },
  refreshCardDone: function(qi){
    var mock = findMock(state.routeParams.mockId); if(!mock) return;
    var card = document.getElementById('qcard-'+qi);
    if(card){
      card.classList.remove('result-correct', 'result-wrong', 'result-left');
      var cls = resultCardClass(mock.questions[qi].result).trim();
      if(cls) card.classList.add(cls);

  toggleMarkAllCorrect: function(el){

      mock.questions.forEach(function(q){ q.result='correct'; q.primary=null; q.secondary=null; });

      if(!q.result) return true;
      if((q.result==='wrong'||q.result==='left') && !q.primary) return true;
      return false;
    });
    if(incomplete) return;
    var plan = findPlan(state.routeParams.mockId); if(!plan) return;
    var mock = findMock(plan.mockId); if(!mock) return;
    var btn = document.querySelector('[data-action="submitCheckpoint"]');
    if(btn){ if(btn.disabled) return; btn.disabled = true; btn.textContent = 'Re-weighting…'; }
    var cpClean = cp.map(function(q){ return {result:q.result, primary:q.primary||null}; });
    requestPlanBlocks({mode:'checkpoint', questions: planQuestions(mock.questions), checkpoint: cpClean}).then(function(blocks){
      plan.blocks = plan.blocks.filter(function(b){ return b.day<8; }).concat(materializeBlocks(blocks, plan.startDate));

    var data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      profile: state.profile,
      mocks: state.mocks.filter(function(m){ return m.id!=='demo'; }),
      plans: state.plans.filter(function(p){ return p.mockId!=='demo'; })
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'mock-to-marks-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  },
  triggerImport: function(){
    var inp = document.getElementById('importFileInput');
    if(inp) inp.click();
  },
  importData: function(el){
    var file = el.files && el.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(String(reader.result));
        if(!data || typeof data!=='object' || !Array.isArray(data.mocks) || !Array.isArray(data.plans)){
          throw new Error('unrecognised backup format');
        }
        var existingMockIds = {}; state.mocks.forEach(function(m){ existingMockIds[m.id]=true; });
        var newMocks = data.mocks.filter(function(m){
          return m && typeof m==='object' && typeof m.id==='string' && typeof m.name==='string' && Array.isArray(m.questions) && !existingMockIds[m.id];
        });
        var existingPlanIds = {}; state.plans.forEach(function(p){ existingPlanIds[p.id]=true; });
        var newPlans = data.plans.filter(function(p){
          return p && typeof p==='object' && typeof p.id==='string' && Array.isArray(p.blocks) && !existingPlanIds[p.id];
        });
        if(newMocks.length===0 && newPlans.length===0){
          window.alert('Nothing new to import — this backup’s mocks and plans are already on this device.');
          el.value=''; return;
        }
        if(!window.confirm('Import '+newMocks.length+' mock(s) and '+newPlans.length+' plan(s) from this file? Existing data on this device is kept as-is.')) { el.value=''; return; }
        state.mocks = state.mocks.concat(newMocks);
        state.plans = state.plans.concat(newPlans);
        if(data.profile && typeof data.profile==='object'){
          state.profile = state.profile || {name:'',examTarget:''};
          if(!state.profile.name && typeof data.profile.name==='string') state.profile.name = data.profile.name;
          if(!state.profile.examTarget && typeof data.profile.examTarget==='string') state.profile.examTarget = data.profile.examTarget;
        }
        persist();
        render();
      }catch(e){
        window.alert('This file could not be read as a Mock-to-Marks backup.');
      }
      el.value='';
    };
    reader.readAsText(file);
  },

  toggleReminders: function(el){
    if(el.checked){
      if(!('Notification' in window)){
        window.alert('Notifications are not supported in this browser.');
        el.checked=false; return;
      }
      Notification.requestPermission().then(function(perm){
        state.profile = state.profile || {};
        if(perm==='granted'){ state.profile.notifyEnabled = true; App.maybeNotifyToday(); }
        else { state.profile.notifyEnabled = false; el.checked=false; }
        persist();
      });
    } else {
      state.profile = state.profile || {};
      state.profile.notifyEnabled = false;
      persist();
    }
  },
  maybeNotifyToday: function(){
    if(!state.profile || !state.profile.notifyEnabled) return;
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    var todayKey = new Date().toISOString().slice(0,10);
    var todaysBlock = null;
    state.plans.forEach(function(p){
      if(todaysBlock || p.mockId==='demo') return;
      var start = new Date(p.startDate || Date.now());
      p.blocks.forEach(function(b){
        if(todaysBlock || b.completed) return;
        var d = new Date(start); d.setDate(d.getDate() + (b.day-1));
        if(d.toISOString().slice(0,10)===todayKey) todaysBlock = b;
      });
    });
    if(todaysBlock){
      try{ new Notification('Today’s Mock-to-Marks block', {body: todaysBlock.title+' — '+todaysBlock.timeMin+' min', icon:'/icon-192.png'}); }catch(e){}
    }
  }
};

/* ---------------- dashboard computation ---------------- */
function realMocks(){ return state.mocks.filter(function(m){ return m.id!=='demo'; }); }
function realPlans(){ return state.plans.filter(function(p){ return p.mockId!=='demo'; }); }

function computeStreak(plans){
  var doneDates = {};
  plans.forEach(function(p){
    var start = new Date(p.startDate || Date.now());
    p.blocks.forEach(function(b){
      if(!b.completed) return;
      var d = new Date(start); d.setDate(d.getDate() + (b.day-1));
      doneDates[d.toISOString().slice(0,10)] = true;
    });
  });
  var cursor = new Date(); cursor.setHours(0,0,0,0);
  if(!doneDates[cursor.toISOString().slice(0,10)]) cursor.setDate(cursor.getDate()-1);
  var streak = 0;
  while(doneDates[cursor.toISOString().slice(0,10)]){
    streak++; cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeDashboard(){
  var mocks = realMocks(), plans = realPlans();
  var totalBlocks=0, doneBlocks=0;
  plans.forEach(function(p){ p.blocks.forEach(function(b){ totalBlocks++; if(b.completed) doneBlocks++; }); });
  var agg = {}; CATEGORIES.forEach(function(c){ agg[c.id] = {score:0, affected:0}; });
  var analysed = 0;
  mocks.forEach(function(m){
    if(!m.questions.every(function(q){ return q.result; })) return;
    analysed++;
    computeScores(m.questions).forEach(function(c){ agg[c.id].score += c.score; agg[c.id].affected += c.affectedCount; });
  });
  var aggList = CATEGORIES.map(function(c){
    return {id:c.id, label:c.label, icon:c.icon, score:Math.round(agg[c.id].score*100)/100, affected:agg[c.id].affected};
  }).filter(function(c){ return c.score>0; }).sort(function(a,b){ return b.score-a.score; });
  var maxScore = aggList.length ? aggList[0].score : 0;
  return {
    mocks: mocks, plans: plans, analysedMocks: analysed,
    totalBlocks: totalBlocks, doneBlocks: doneBlocks,
    completionPct: totalBlocks ? Math.round(doneBlocks/totalBlocks*100) : 0,
    aggList: aggList, maxScore: maxScore,
    streak: computeStreak(plans)
  };
}

/* simple timer, isolated so overlay markup stays string-based */
var TimerApp = (function(){
  var remaining=0, interval=null, running=false;
  function render2(){
    var el=document.getElementById('timerDisplay'); if(!el) return;
    var m=Math.floor(remaining/60), s=remaining%60;
    el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  return {
    reset:function(minutes){ clearInterval(interval); running=false; remaining=minutes*60; render2();
      var btn=document.getElementById('timerToggleBtn'); if(btn) btn.textContent='Start'; },
    toggle:function(){
      var btn=document.getElementById('timerToggleBtn');
      if(!remaining){ var disp=document.getElementById('timerDisplay'); if(disp){ var parts=disp.textContent.split(':'); remaining=Number(parts[0])*60+Number(parts[1]); } }
      if(running){ clearInterval(interval); running=false; if(btn) btn.textContent='Start'; return; }
      running=true; if(btn) btn.textContent='Pause';
      interval=setInterval(function(){
        remaining=Math.max(0,remaining-1); render2();
        if(remaining<=0){ clearInterval(interval); running=false; if(btn) btn.textContent='Start'; }
      },1000);
    }
  };
})();
window.TimerApp = TimerApp;

/* ---------------- view: compare ---------------- */
function viewCompare(){
  var mock = findMock(state.routeParams.mockId);
  var plan = mock && findPlan(mock.id);
  var followupId = state.routeParams.followupId || (plan && plan.followupMockId);
  var followup = followupId ? findMock(followupId) : null;

  if(followup && plan && plan.followupMockId !== followup.id){
    plan.followupMockId = followup.id; persist();
  }

  if(!mock || !followup) return topbar()+'<div class="shell page"><div class="empty">Comparison not ready yet.</div></div>';

  var s1 = computeScores(mock.questions), s2 = computeScores(followup.questions);
  function acc(m){
    var attempted = m.questions.filter(function(q){return q.result && q.result!=='left';});
    var correct = attempted.filter(function(q){return q.result==='correct'||q.result==='slow'||q.result==='guessed';});
    return attempted.length ? Math.round(correct.length/attempted.length*1000)/10 : 0;
  }
  var acc1=acc(mock), acc2=acc(followup);
  var marksDelta = followup.marksScored - mock.marksScored;
  var accDelta = Math.round((acc2-acc1)*10)/10;

  var top3 = s1.filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,3);
  var rows = top3.map(function(c){
    var c2 = s2.find(function(x){return x.id===c.id;});
    var loss1 = c.affectedCount*mock.marksPerQ, loss2=c2.affectedCount*followup.marksPerQ;
    var recovered = loss1-loss2;
    return {label:c.label, loss1:loss1, loss2:loss2, recovered:recovered};
  });
  var biggestGain = rows.slice().sort(function(a,b){return b.recovered-a.recovered;})[0];
  var stillOpen = s2.filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score;})[0];

  var takeaway = 'You '+(marksDelta>=0?'gained ':'lost ')+Math.abs(marksDelta)+' marks.'+
    (biggestGain && biggestGain.recovered>0 ? ' Your largest improvement came from '+biggestGain.label.toLowerCase()+'.' : '')+
    (stillOpen ? ' Your next cycle should keep an eye on '+stillOpen.label.toLowerCase()+'.' : '');

  var prep1 = computePreparedness(mock), prep2 = computePreparedness(followup);
  var prepDelta = prep2.overall - prep1.overall;
  var radarSvg2 = buildRadarSVG([
    {values: prep1.items.map(function(i){return i.prep;}), colorVar:'--ink-faint', filled:false},
    {values: prep2.items.map(function(i){return i.prep;}), colorVar:'--primary', filled:true}
  ], {ariaLabel:'Readiness comparison, day 1 versus day 14'});

  return topbar() + '<div class="shell page">'+
    '<button class="page-back" data-action="toCalendar" data-id="'+mock.id+'">← Plan</button>'+
    '<h2 class="page-title">Day 1 vs Day 14 — '+esc(mock.name)+'</h2>'+
    '<div class="card radar-section" style="margin-top:20px;">'+
      '<div class="radar-chart-wrap">'+radarSvg2+'</div>'+
      '<div class="radar-side">'+
        '<div class="radar-stat-label">Readiness index</div>'+
        '<div class="radar-stat-value '+readinessClass(prep2.overall)+'">'+prep2.overall+'<sup>/100</sup></div>'+
        '<div class="radar-stat-note">'+(prepDelta>=0 ? 'Up '+prepDelta+' point'+(prepDelta===1?'':'s')+' from '+prep1.overall+'/100 on Day 1.' : 'Down '+Math.abs(prepDelta)+' point'+(Math.abs(prepDelta)===1?'':'s')+' from '+prep1.overall+'/100 on Day 1 — worth another cycle.')+'</div>'+
        radarLegendHtml([{label:'Day 1 (baseline)',cls:'hollow'},{label:'Day 14 (now)',cls:'filled'}])+
      '</div>'+
    '</div>'+
    '<div class="tablewrap radar-mini-table"><table>'+
      '<thead><tr><th>Front</th><th style="text-align:right;">Day 1</th><th style="text-align:right;">Day 14</th><th style="text-align:right;">Change</th></tr></thead>'+
      '<tbody>'+ prep1.items.map(function(it,i){
        var p2 = prep2.items[i].prep, d = p2-it.prep;
        return '<tr><td>'+it.label+'</td><td class="num">'+it.prep+'</td><td class="num">'+p2+'</td><td class="num '+(d>=0?'change-pos':'change-neg')+'">'+(d>=0?'+':'')+d+'</td></tr>';
      }).join('') +'</tbody>'+
    '</table></div>'+
    '<div class="tablewrap" style="margin-top:20px;"><table>'+
      '<thead><tr><th>Metric</th><th style="text-align:right;">Day 1 mock</th><th style="text-align:right;">Day 14 mock</th><th style="text-align:right;">Change</th></tr></thead>'+
      '<tbody>'+
        '<tr><td>Marks scored</td><td class="num">'+mock.marksScored+'</td><td class="num">'+followup.marksScored+'</td><td class="num '+(marksDelta>=0?'change-pos':'change-neg')+'">'+(marksDelta>=0?'+':'')+marksDelta+'</td></tr>'+
        '<tr><td>Accuracy</td><td class="num">'+acc1+'%</td><td class="num">'+acc2+'%</td><td class="num '+(accDelta>=0?'change-pos':'change-neg')+'">'+(accDelta>=0?'+':'')+accDelta+' pp</td></tr>'+
        rows.map(function(r){
          var d = r.loss1-r.loss2;
          return '<tr><td>'+r.label+' losses (approx.)</td><td class="num">'+r.loss1+'</td><td class="num">'+r.loss2+'</td><td class="num '+(d>=0?'change-pos':'change-neg')+'">'+(d>=0?d+' recovered':(Math.abs(d)+' worse')) +'</td></tr>';
        }).join('')+
      '</tbody></table></div>'+
    '<div class="diag-hero" style="margin-top:20px;"><p>'+takeaway+'</p></div>'+
    '<p class="helper">Marks figures are approximate, based on marks-per-question entered on each mock and are not a guarantee of rank or score.</p>'+
  '</div>';
}

/* ---------------- main render ---------------- */
function render(){
  var app = document.getElementById('app');
  var html='';
  switch(state.route){
    case 'create': html = viewCreate(); break;
    case 'analyze': html = viewAnalyze(); break;
    case 'diagnosis': html = viewDiagnosis(); break;
    case 'calendar': html = viewCalendar(); break;
    case 'compare': html = viewCompare(); break;
    case 'profile': html = viewProfile(); break;
    default: html = viewLanding();
  }
  app.innerHTML = html;
}

// Delegated at the document, not #app: the desktop sidenav (New mock /
// Sample mock / Settings) lives outside #app as persistent page chrome,
// and its buttons use these same data-action handlers.
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;
  // Backdrop dismiss only fires when the backdrop itself was clicked, not
  // when a click inside the card bubbled up and matched it via closest().
  if((action==='closeGate' || action==='__noop') && t!==e.target) return;
  if(action==='__noop'){ App.closeTask(); return; }
  if(App[action]) App[action](t);
});
document.getElementById('app').addEventListener('change', function(e){
  var t = e.target.closest('[data-field]');
  if(t) App.fieldChange(t);
});
document.getElementById('app').addEventListener('input', function(e){
  var t = e.target.closest('[data-field]');
  if(t && (t.tagName==='INPUT' && (t.type==='text'||t.type==='number')) ) App.fieldChange(t);
});
// 'error' on <img> doesn't bubble, so this only works in the capture phase —
// falls back to a silhouette if a Google profile photo URL fails to load.
document.getElementById('app').addEventListener('error', function(e){
  var img = e.target;
  if(img.classList && img.classList.contains('avatar-photo')){
    img.outerHTML = icon('<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/>');
  }
}, true);

/* ---------------- PWA install + offline support ---------------- */
var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  var btn = document.getElementById('pwaInstallBtn');
  if(btn) btn.hidden = false;
});
var pwaBtn = document.getElementById('pwaInstallBtn');
if(pwaBtn){
  pwaBtn.addEventListener('click', function(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      pwaBtn.hidden = true;
    });
  });
}
window.addEventListener('appinstalled', function(){
  var btn = document.getElementById('pwaInstallBtn');
  if(btn) btn.hidden = true;
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){ /* offline caching unavailable - app still works online */ });
  });
  // A stale cached bundle here isn't just cosmetic - it can mean a student sees
  // an old readiness score or an ungated build. Reload once, automatically,
  // the moment a newer service worker takes control, instead of waiting for a
  // manual refresh.
  var swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}

/* ---------------- keyboard shortcuts: question analysis grid ---------------- */
document.addEventListener('keydown', function(e){
  if(state.route!=='analyze') return;
  var tgt = e.target;
  var tag = (tgt.tagName||'').toLowerCase();
  if(tag==='textarea' || (tag==='input' && (tgt.type==='text'||tgt.type==='number')) || tag==='select') return;
  var card = tgt.closest && tgt.closest('.qcard');
  if(!card) return;
  if(e.key>='1' && e.key<='6'){
    var cat = CATEGORIES[Number(e.key)-1]; if(!cat) return;
    var radio = card.querySelector('input[type=radio][data-field$=".primary"][value="'+cat.id+'"]');
    if(!radio) return;
    e.preventDefault();
    radio.checked = true;
    radio.dispatchEvent(new Event('change', {bubbles:true}));
    radio.focus();
  } else if((e.key==='ArrowDown' || e.key==='ArrowUp') && e.altKey){
    e.preventDefault();
    var cards = Array.prototype.slice.call(document.querySelectorAll('.qcard'));
    var next = cards[cards.indexOf(card) + (e.key==='ArrowDown'?1:-1)];
    if(next){
      var focusTarget = next.querySelector('input[type=radio]:checked') || next.querySelector('input, select');
      if(focusTarget){ focusTarget.focus(); if(focusTarget.scrollIntoView) focusTarget.scrollIntoView({block:'center', behavior:'smooth'}); }
    }
  }
});

/* ---------------- entry routing (PWA shortcuts) ---------------- */
function handleEntryRoute(){
  try{
    var params = new URLSearchParams(location.search);
    var r = params.get('route');
    if(!r) return false;
    history.replaceState(null, '', location.pathname);
    if(r==='new'){
      nav('create', {role:'initial'});
      return true;
    } else if(r==='today'){
      var withPlan = realMocks().filter(function(m){ return findPlan(m.id); })
        .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
      if(withPlan.length){ nav('calendar', {mockId: withPlan[0].id}); return true; }
    }
  }catch(e){ /* URLSearchParams unsupported or blocked - fall through to normal landing */ }
  return false;
}

/* hot-reload friendliness for republishes */
function boot(){
  // routed through nav() (not a direct render()) so a PWA shortcut launch
  // still passes through the sign-in gate like any other non-landing route.
  var handled = handleEntryRoute();
  if(!handled) render();
  App.maybeNotifyToday();
}
if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
} else {
  boot();
}
})();
