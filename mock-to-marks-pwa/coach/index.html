<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProDJEE Coach — Personalised JEE &amp; NEET Improvement</title>
<meta name="description" content="Your personalised JEE or NEET dashboard: daily missions, verified exam updates, custom tests, score targets and spaced revision.">
<link rel="stylesheet" href="/assets/pj-core.css"><link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#080a14;--card:#111526;--line:#29304a;--ink:#f7f4ec;--muted:#a7acc1;--gold:#ffc23d;--mint:#4ff0a0;--red:#f04848}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#242019 0,transparent 34%),var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:32px auto 80px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.03;margin:5px 0}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 6;background:linear-gradient(145deg,rgba(25,30,50,.96),rgba(13,16,30,.98));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px #0006}.wide{grid-column:span 12}.third{grid-column:span 4}h2{margin:0 0 8px;font-size:22px}h3{margin:0}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.primary{background:var(--gold);color:#241b04}.ghost{background:#1b2034;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.pill{padding:5px 9px;border-radius:999px;background:#20263c;font-size:12px}.good{color:var(--mint)}.warn{color:var(--gold)}label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}input,select{width:100%;background:#0c1020;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.chapters{max-height:290px;overflow:auto}.chapter{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.news a{color:var(--ink);text-decoration:none}.news small{display:block;color:var(--muted)}.score{font-size:32px;font-weight:900;color:var(--gold)}dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;background:#111526;color:var(--ink);padding:24px}dialog::backdrop{background:#03040bd9}.exam-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.exam-choice button{padding:22px}.toast{position:fixed;right:18px;bottom:18px;background:#222a42;padding:12px 16px;border-radius:12px;display:none}@media(max-width:760px){.card,.third{grid-column:span 12}.hero{align-items:start;flex-direction:column}.formgrid{grid-template-columns:1fr}.pj-links a:nth-child(3){display:none}}
</style></head><body>
<header class="pj-bar"><div class="pj-bar-inner"><a class="pj-brand" href="/"><img src="/assets/logo-192.png" alt="ProDJEE logo"><b>Pro<span>DJEE</span></b></a><nav class="pj-links"><a href="/">Home</a><a href="/arena/">Arena</a><a href="/m2m/">Analysis</a><a href="/news/" class="pj-news-link">News<span class="pj-news-dot"></span></a><a href="/coach/" class="on">Coach</a></nav><button class="pj-avatar" data-pj-avatar data-pj-act="profile" aria-label="Account"></button></div></header>
<main class="wrap"><section class="hero"><div><div class="eyebrow" id="examLabel"></div><h1>Your improvement coach</h1><div class="muted">One place for today’s work, revision, tests, targets and personalised exercises.</div></div></section><div class="grid" id="dashboard"></div></main><div class="toast" id="toast"></div>
<script src="/assets/subject-chapters.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="/assets/pj-core.js"></script>
<script src="/coach/app.js"></script></body></html>
