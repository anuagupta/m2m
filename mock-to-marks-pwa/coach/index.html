<style>
:root{--bg:#080a14;--card:#111526;--line:#29304a;--ink:#f7f4ec;--muted:#a7acc1;--gold:#ffc23d;--mint:#4ff0a0;--red:#f04848}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#242019 0,transparent 34%),var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:32px auto 80px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.03;margin:5px 0}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 6;background:linear-gradient(145deg,rgba(25,30,50,.96),rgba(13,16,30,.98));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 18px 50px #0006}.wide{grid-column:span 12}.third{grid-column:span 4}h2{margin:0 0 8px;font-size:22px}h3{margin:0}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.primary{background:var(--gold);color:#241b04}.ghost{background:#1b2034;color:var(--ink);border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.pill{padding:5px 9px;border-radius:999px;background:#20263c;font-size:12px}.good{color:var(--mint)}.warn{color:var(--gold)}label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}input,select{width:100%;background:#0c1020;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.chapters{max-height:290px;overflow:auto}.chapter{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.news a{color:var(--ink);text-decoration:none}.news small{display:block;color:var(--muted)}.score{font-size:32px;font-weight:900;color:var(--gold)}dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;background:#111526;color:var(--ink);padding:24px}dialog::backdrop{background:#03040bd9}.exam-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.exam-choice button{padding:22px}.toast{position:fixed;right:18px;bottom:18px;background:#222a42;padding:12px 16px;border-radius:12px;display:none}@media(max-width:760px){.card,.third{grid-column:span 12}.hero{align-items:start;flex-direction:column}.formgrid{grid-template-columns:1fr}}
:root{--gold:#d9b46f;--mint:#7fc6a4;--red:#cf7e7b}
body{font-family:var(--pj-sans);line-height:1.55;-webkit-font-smoothing:antialiased}.hero h1,h2,h3{font-family:var(--pj-serif);font-weight:600;letter-spacing:-.015em}.hero h1{line-height:1.08}.btn,button,input,select{font-family:inherit}
.coach-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 20px;padding:6px;border:1px solid rgba(180,162,207,.16);border-radius:18px;background:rgba(17,21,38,.58);backdrop-filter:blur(18px)}.coach-tabs button{border:0;border-radius:13px;padding:11px 8px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .18s ease}.coach-tabs button.on{color:var(--ink);background:linear-gradient(145deg,rgba(180,162,207,.19),rgba(217,180,111,.09));box-shadow:inset 0 0 0 1px rgba(180,162,207,.22),0 0 22px rgba(180,162,207,.1)}.coach-panel{display:contents}.coach-panel>.card{animation:coachIn .18s ease-out both}.coach-panel.coach-out>.card{animation:coachOut .11s ease-in both}.progress-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.progress-metrics div{padding:15px;border:1px solid var(--line);border-radius:15px;background:rgba(180,162,207,.06)}.progress-metrics b{display:block;font-size:25px;color:var(--gold)}.progress-metrics span{display:block;color:var(--muted);font-size:12px}.settings-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}@keyframes coachIn{from{opacity:0;transform:translateY(5px)}}@keyframes coachOut{to{opacity:0;transform:translateY(-3px)}}@media(max-width:620px){.coach-tabs{grid-template-columns:repeat(2,1fr)}.coach-tabs button{font-size:12px}.progress-metrics{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.coach-panel>.card{animation:none!important}}
</style></head><body>
