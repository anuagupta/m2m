</style></head><body><header class="pj-bar"><div class="pj-bar-inner"><div class="pj-brand"><img src="/assets/logo-192.png" alt="ProDJEE logo"><b>Pro<span>DJEE</span></b></div><nav class="pj-links"><a href="/">Home</a><a href="/arena/">Arena</a><a href="/m2m/">M2M</a><a href="/news/" class="on pj-news-link">News<span class="pj-news-dot"></span></a><a href="/coach/">Coach</a></nav><button class="pj-avatar" data-pj-avatar data-pj-act="profile" aria-label="Account"></button></div></header><main class="wrap"><section class="head"><div class="eyebrow" id="examLabel"></div><h1>Verified exam news</h1><p class="muted">Applications, corrections, city slips, admit cards, answer keys and results from official NTA sources only.</p><a class="settings" href="/#profile">Change exam in Profile →</a></section><section class="card" id="updates"><p class="muted">Loading official notices…</p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="/assets/pj-core.js"></script><script>
(function(){function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{};}catch(e){return {};}}var p=read('prodjee.student.v1'),a=read('prodjee.arena.v1'),exam=p.exam==='NEET'||(!p.exam&&a.exam==='NEET')?'NEET':'JEE';document.getElementById('examLabel').textContent=exam+' · official updates';var fallback=exam==='NEET'?'https://neet.nta.nic.in/':'https://jeemain.nta.nic.in/';fetch('/api/exam-updates?exam='+exam).then(function(r){return r.ok?r.json():Promise.reject();}).then(function(d){if(!d.updates||!d.updates.length)throw Error();document.getElementById('updates').innerHTML=d.updates.map(function(n){return '<article class="update"><div><a href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a><small>Official NTA notice</small></div><span class="source">↗</span></article>';}).join('');}).catch(function(){document.getElementById('updates').innerHTML='<p class="muted">Official notices could not be loaded right now.</p><a class="settings" href="'+fallback+'" target="_blank" rel="noopener">Open the official '+exam+' portal →</a>';});})();
</script></body></html>
