<!doctype html><html><body style="margin:0;background:#fff"><canvas id="c"></canvas>
<script type="module">
import * as pdfjs from './pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';
window.load = async (url) => { window.doc = await pdfjs.getDocument(url).promise; return window.doc.numPages; };
window.renderPage = async (n, scale) => {
  const page = await window.doc.getPage(n); const vp = page.getViewport({ scale });
  const c = document.getElementById('c'); c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return [vp.width, vp.height];
};
window.pageText = async (n) => { const pg = await window.doc.getPage(n); const tc = await pg.getTextContent(); let out='', lastY=null; for (const it of tc.items) { const y=Math.round(it.transform[5]); if (lastY!==null && Math.abs(y-lastY)>2) out+='\n'; else if (out) out+=' '; out+=it.str; lastY=y; } return out; };
window.ready = true;
</script></body></html>
