<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" role="img" aria-labelledby="title desc">
  <title id="title">Solubility curve for ions X and Y</title>
  <desc id="desc">A decreasing curve of Y concentration against X concentration, passing through approximately 1 millimolar X and 2 millimolar Y, and 2 millimolar X and 1.4 millimolar Y.</desc>
  <rect width="520" height="400" rx="18" fill="#fff"/>
  <g stroke="#171a2b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 320V55M105 320H450"/>
    <path d="M105 55L96 72M105 55L114 72M450 320L433 311M450 320L433 329"/>
    <path d="M180 313V327M255 313V327M330 313V327M98 245H112M98 170H112M98 95H112"/>
    <path d="M125 72C145 135 168 164 205 182C255 207 315 225 415 237" stroke="#3567d6" stroke-width="6"/>
    <circle cx="180" cy="170" r="6" fill="#3567d6" stroke="#3567d6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#171a2b" font-size="25">
    <text x="165" y="356">1</text><text x="240" y="356">2</text><text x="315" y="356">3</text>
    <text x="68" y="253">1</text><text x="68" y="178">2</text><text x="68" y="103">3</text>
    <text x="235" y="390">[X] / mM</text>
