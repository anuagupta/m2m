<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Diode-transistor logic circuit</title>
  <desc id="desc">A five volt source feeds two switches A and B. Each switch connects through a diode to a common node with a pull-down resistor. The node drives an NPN transistor whose collector output Y is pulled up to five volts.</desc>
