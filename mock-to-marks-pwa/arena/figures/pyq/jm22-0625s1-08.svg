<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 150' width='480' height='150'>
<rect width='100%' height='100%' fill='#fff'/>
<!-- Original diagram: an infinite plane sheet of positive charge (vertical hatched line),
     with two points P1 and P2 at increasing perpendicular distance l and 2l. -->
<line x1='90' y1='15' x2='90' y2='135' stroke='#000' stroke-width='3'/>
<g stroke='#000' stroke-width='1.3'>
<line x1='90' y1='24' x2='78' y2='34'/>
<line x1='90' y1='44' x2='78' y2='54'/>
<line x1='90' y1='64' x2='78' y2='74'/>
<line x1='90' y1='84' x2='78' y2='94'/>
<line x1='90' y1='104' x2='78' y2='114'/>
<line x1='90' y1='124' x2='78' y2='134'/>
</g>
<text x='60' y='75' font-size='22' text-anchor='middle' font-family='Times New Roman,serif' fill='#1f2937'>+</text>
<g stroke='#1f2937' stroke-width='1.6' marker-end='url(#arrow)'>
<line x1='90' y1='75' x2='210' y2='75'/>
<line x1='90' y1='75' x2='390' y2='75'/>
</g>
<defs>
<marker id='arrow' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'>
<path d='M0,0 L6,3 L0,6 z' fill='#1f2937'/>
</marker>
</defs>
<circle cx='210' cy='75' r='4' fill='#1f2937'/>
<circle cx='390' cy='75' r='4' fill='#1f2937'/>
<text x='210' y='60' font-size='16' text-anchor='middle' font-family='Times New Roman,serif' font-style='italic' fill='#1f2937'>P&#8321;</text>
<text x='390' y='60' font-size='16' text-anchor='middle' font-family='Times New Roman,serif' font-style='italic' fill='#1f2937'>P&#8322;</text>
<text x='150' y='95' font-size='15' text-anchor='middle' font-family='Times New Roman,serif' font-style='italic' fill='#1f2937'>l</text>
<text x='300' y='95' font-size='15' text-anchor='middle' font-family='Times New Roman,serif' font-style='italic' fill='#1f2937'>2l</text>
<text x='90' y='148' font-size='13' text-anchor='middle' font-family='Times New Roman,serif' fill='#1f2937'>charged sheet, &#963;</text>
</svg>
