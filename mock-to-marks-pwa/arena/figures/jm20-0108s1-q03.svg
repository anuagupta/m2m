<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Flag-shaped uniform lamina</title>
  <desc id="desc">An L-shaped lamina with vertices at (0,0), (1,0), (1,2), (2,2), (2,3), and (0,3).</desc>
  <rect width="360" height="360" fill="#ffffff"/>
  <g transform="translate(75 300) scale(75 -75)" fill="#dbeafe" stroke="#111827" stroke-width="0.035" stroke-linejoin="round">
    <path d="M0 0 H1 V2 H2 V3 H0 Z"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="17">
    <text x="35" y="322">(0, 0)</text>
    <text x="139" y="322">(1, 0)</text>
    <text x="139" y="159">(1, 2)</text>
    <text x="226" y="159">(2, 2)</text>
    <text x="226" y="67">(2, 3)</text>
    <text x="35" y="67">(0, 3)</text>
  </g>
</svg>
